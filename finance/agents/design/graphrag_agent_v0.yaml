design_trace_example:
  question_id: EQ01
  question: "그랜드하모니호텔 대출을 150억 증액하려고 해. 정상 분류 유지된다고 치면 최소 충당금이 얼마 더 필요해?"
  executed: false
  note: "구현 전(v0.3.0) 설계 시뮬레이션 — 바이트 수 등은 측정값이 아님. 실제 실행 기록은 ontology/eval_question/compare_run.json (09-29 재수집), 구현 기준 그림은 아래 diagrams (v0.3.2)"
  steps:
    - n: 0
      kind: callback
      name: "before_agent · Alias + BQG KC Aspect 바인딩 (D3)"
      detail: "ont_entity_aliases(438 rows) 최장일치 → '그랜드하모니호텔' → KC 고정 템플릿 (c:Customer {customer_id:'CUST_0016'}) 바인딩 + 스키마 카드(11C·15E) 주입"
      budget_used: 0
    - n: 1
      kind: tool
      name: "graph_query (GQL Planner 생성 + BQ Dry-Run 검증 + 단일 통합 GQL 실행)"
      detail: "GRAPH starlight_bank_ontology.finance_graph MATCH (c:Customer {customer_id:'CUST_0016'})<-[:BORROWED_BY]-(l:LoanContract)-[:GOVERNED_BY_CRITERIA]->(pr:Provision)-[:HAS_EXCEPTION_PROVISO]->(px:Provision) RETURN c.ksic_section_code, l.asset_classification, px.provision_slot_id, px.kc_entry_id, DIV(15000000000 * 90, 10000) AS added_min_provision_krw — Dry-Run(8,192B, ok=True) 통과 후 GQL 한 번으로 업종('H')·단서 조문(art_029_1_1_a_proviso)·추가 충당금(1.35억) 동시 확보!"
      budget_used: 1
    - n: 2
      kind: tool
      name: "kc_lookup (OKF 조문 KC 유효성 검증)"
      detail: "kc_entry_id = 01-fsc-bank-reg-art-029-1-1-a-proviso → verdict ALLOW (status: stable ∈ {stable, verified}) 통과!"
      budget_used: 2
    - n: 3
      kind: tool
      name: "fetch_provision (D4 ObjectRef 서명 URL 원문 조회)"
      detail: "KC ALLOW 통과 확인 후 OBJ.GET_ACCESS_URL(gcs_obj_ref, 'r') 서명 URL → art_029_1_1_a_proviso.md 원문 '숙박 및 음식점업(H)… 100분의 0.9 이상' (01번 PDF 20쪽, sha256 일치)"
      budget_used: 3
    - n: 4
      kind: answer
      name: "compose (after_model · citation_check)"
      detail: "1억 3,500만 원 (150억 × 0.9%, KSIC H 단서) — 별도 bigquery_sql 없이 GQL 한 번 + KC 검증 + ObjectRef 원문으로 총 3회 도구 호출 만에 완결 · 인용 [01 · 제29조 · p.20]"
      budget_used: 3

