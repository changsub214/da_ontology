# 9. 그림 원천 (v0.3.2 · ADR 0015) — 스튜디오 01 Intro · docs/viewer.html §07 / §11 은 이 블록만 렌더한다.
#    tools/export_intro_arch.py → okf_veri_web/data/intro_arch.json  (tools/export_agent_design.py 도 같은 블록을 검사)
