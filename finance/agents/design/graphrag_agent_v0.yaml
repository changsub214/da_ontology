            LM["Gemini 3.8 Flash · 호출 3곳<br/>질의 플래닝 · GQL 교정 · 브리핑 합성"]
            CB["가드레일 · 콜백<br/>엔티티 그라운딩 · Dry-Run 가드<br/>거버넌스 차단 · 인용 검증"]
            TL["핵심 도구 3종<br/>위상 그래프 조회 · KC 유효성 조회<br/>OKF 원문 인출"]
          end
          subgraph ST["3-Plane · 감사 저장소"]
