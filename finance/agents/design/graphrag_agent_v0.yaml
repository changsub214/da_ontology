# ----------------------------------------------------------------------------
# 0. RAG Agent vs GraphRAG Agent 패러다임 비교 (왜 나누지 않고 GQL 로 일원화하는가)
# ----------------------------------------------------------------------------
paradigm_comparison:
  summary: "RAG 에이전트와 GraphRAG 에이전트는 각자의 고유 패러다임으로 동일한 원장·규정 문제를 풀며, GraphRAG 내부를 product 용과 eval 용으로 인위적으로 쪼개지 않는다. 또한 finance_graph 안에 Spanner 연합 원장(ont_*)과 BQ 마스터 원장 8종이 이미 노드·엣지로 들어가 있으므로 GraphRAG 는 별도 bigquery_sql 없이 통합 GQL 한 번으로 그래프 순회와 정량 집계를 함께 수행한다."
  rag_agent:
    name: "RAG Agent (Baseline · starlight_rag)"
    badge: "Vertex AI RAG Engine + BigQuery SQL"
    tools: [vertex_rag_search, bigquery_sql]
    steps:
      - "1. 비정형 검색 (vertex_rag_search): GCP Vertex AI RAG Engine 에서 원본 PDF 10종(142쪽) 벡터 청크 검색"
      - "2. 정형 조회 (bigquery_sql): starlight_bank.* 및 Spanner 연합 뷰(ont_*)에 대해 일반 관계형 SQL(SELECT/JOIN) 실행"
      - "3. 한계: PDF 청크(규정)와 SQL 테이블(원장) 사이에 명시적 엣지나 부서 맥락(BusinessContext)·단서 분기·KC 유효성 게이트가 없어 LLM 이 추론으로만 연결해야 함"
  graphrag_agent:
    name: "GraphRAG Agent (Ours · starlight_graphrag — 단일 통합 아키텍처)"
    badge: "Alias & KC Template ➔ GQL Planner + BQ Dry-Run ➔ KC Gate ➔ Unified GQL & ObjectRef"
    tools: [graph_query, kc_lookup, fetch_provision]
    steps:
      - "1. Input ➔ Alias & BQG KC Aspect 바인딩 (before_agent, <1ms): ont_entity_aliases(438행) 최장일치 탐색 + finance_graph 의 KC Aspect(ontology-class-anchors v1.2.0)에 고정된 gql_match_template($CANONICAL_ID) 및 11C·15E 스키마 카드 로드"
      - "2. GQL Planner ➔ 통합 GQL 생성 & BigQuery Dry-Run 검증: 고정 앵커 템플릿을 GQL 플래너에 넘겨 다중홉 규정 순회 + Spanner 연합 원장 정량 집계를 단일 GQL(GRAPH / GRAPH_TABLE, Module 04 방식)로 작성하고, 실행 전 BigQuery Dry-Run(dry_run=True)으로 문법·스키마·스캔 바이트를 검증"
      - "3. KC 유효성 게이트 (kc_lookup): OKF 조문(kc_entry_id)을 참조할 때 Dataplex KC 의 okf Aspect(status ∈ {'stable','verified'} vs 'deprecated', superseded_by ≤3-hop)를 검증"
      - "4-A. [KC 통과 못함 · BLOCKED_DEPRECATED]: 즉시 답변 불가 처리 — 추측 답변을 차단하고 고객 신속 조치 안내문(접수번호 INC-...) 반환 + IncidentSinkPort 발행"
      - "4-B. [KC 통과 · ALLOW / SUPERSEDED_RESOLVED]: Dry-Run 검증을 마친 통합 GQL 실행 결과 + BigQuery ObjectRef 서명 URL(OBJ.GET_ACCESS_URL(gcs_obj_ref,'r')) 원문(fetch_provision)으로 인용 기반 최종 답변 생성"

# ----------------------------------------------------------------------------
# 1. 에이전트가 보는 3개 표면 (실측값 — 추측 아님)
# ----------------------------------------------------------------------------
surfaces:
  bigquery:
    dataset: finance-ontology-changseop.starlight_bank_ontology   # us-central1
    property_graph: finance_graph            # 11 node views + 15 edge views (8종 원장 + 부서맥락 + 조문 통합)
    node_labels: [BusinessContext, SourceDocument, Provision, LoanContract, Customer,
                  FinancialProduct, WorkoutHistory, Collateral, DelinquencyEvent,
                  RateCutRequest, ExceptionApproval]
    edge_labels: [SCOPES_PORTFOLIO, INVOKES_PROVISION, GOVERNED_BY_CRITERIA,
                  EVALUATED_UNDER_PROVISION, PART_OF_DOCUMENT, HAS_EXCEPTION_PROVISO,
                  DELEGATES_TO_INTERNAL, CONFLICTS_BY_SECTOR, BORROWED_BY, OF_PRODUCT,
                  HAS_COLLATERAL, HAS_DELINQUENCY, HAS_RATE_CUT_REQUEST,
                  HAS_EXCEPTION_APPROVAL, HAS_WORKOUT_HISTORY]
    alias_table: starlight_bank_ontology.ont_entity_aliases   # 438 rows (11개 전체 노드 클래스 + Glossary 7종 바인딩 완료)
    objectref: "v_node_provision.gcs_obj_ref / v_node_source_document.gcs_obj_ref (connection us-central1.okf-gcs-conn)"
    ledger_via_federation: "finance_graph 내부 LDM 노드 뷰(v_node_*)가 starlight_bank.ont_* (Spanner Data Boost) 및 BQ 마스터 테이블을 직접 래핑 → 별도 bigquery_sql 없이 GQL 로 원장 집계 완결"
  knowledge_catalog:
    graph_entry: "@bigquery/.../propertyGraphs/finance_graph + aspect ontology-class-anchors (v1.2.0 · 11/11 고정 gql_match_template)"
    okf_entry_group: finance-okf          # 233 entries = 번들 229 + Q21 고정물 4 (tools/okf_fixtures.yaml, 2026-09-29 실측), aspect `okf` (status ∈ {stable, verified} vs deprecated, superseded_by, verified[])
    glossary: starlight-finance-glossary  # 7 terms → INVOKES_PROVISION.term_key
  gcs:
    bundle: gs://finance_okf/okf/          # 188 concepts (문서 10 + 조문 178) · 로컬 md 229 (index · log · versions/ · distractors/ 포함) + 원격 전용 고정물 md 3 = md 232 + locations.yaml
    read_path: "OBJ.GET_ACCESS_URL(gcs_obj_ref,'r') → signed URL (BigQuery Graph ObjectRef 경유 · 에이전트 SA 에 GCS 직접 권한 불필요)"

