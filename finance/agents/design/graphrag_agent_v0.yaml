#      ontology/l1.yaml, 또는 conventions.vocabulary 에 실제로 있어야 한다. 하나라도 없으면 exit 1 (파일 안 씀).
#    · 2-1 은 손으로 그리지 않는다 — ontology/l1.yaml + 라이브 라벨 건수로 생성.
#    · 옛 sequence_lifelines · sequence_scenarios(LLM 이 도구를 고르는 모델, v0.3.1 까지)는 삭제됨.
