  intro_tabs:
    - id: sys
      title: "시스템 아키텍처"
      # 첫 화면 히어로 (사용자 2026-09-30 00:40Z): '왜 Knowledge Graph 인가' 관점 · 안 2 구성 + 안 1 제목.
      # 버튼 · EQ 점수(20/20 · 15/20)는 넣지 않는다 — 점수는 06 에서 보여 줄 내용.
      # example 은 06 저장 리포트(okf_veri_web/data/eq_compare.json)의 실제 한 문항 — export_intro_arch.py G9 가
      # 질문 원문 · 판정 · 답 금액이 리포트와 같은지 확인한다 (다르면 파일 안 씀).
      hero:
        eyebrow: "왜 Knowledge Graph 인가"
        title: "여신 판단의 답은 문서 한 곳에 있지 않습니다.<br><em>조문 · 단서 · 부서 맥락 · 원장의 연결</em> 속에 있습니다."
        sub: "문서 검색은 비슷한 문장을 찾아 줍니다. 하지만 심사 · 리스크 · 준법 판단에는 어느 조문이 · 어떤 예외와 함께 · 누구의 기준으로 · 어떤 계약에 적용되는지가 필요합니다. 이 관계는 문장 안에 쓰여 있지 않고 문서 사이에 흩어져 있습니다. 같은 질문을 두 방식에 던져 보면 차이가 보입니다."
        example:
          eq: EQ01
          question: "그랜드하모니호텔 대출을 150억 증액하려고 해. 정상 분류 유지된다고 치면 최소 충당금이 얼마 더 필요해?"
          arms:
            - arm: rag
              label: "문서 검색 (Vector RAG)"
              verdict: incorrect
              answer: "1억 2,750만 원"
              steps:
                - "'정상 여신 충당금' 청크 검색 → 원칙 <b>0.85%</b> 발견"
                - "같은 조문 뒤에 붙은 업종 단서(F·G·H·L)와 호텔업(H)을 잇지 못함"
                - "150억 × 0.85% 로 계산"
            - arm: graphrag
              label: "Knowledge Graph (Graph)"
              verdict: correct
              answer: "1억 4,000만 원"
              steps:
                - "계약 → 차주 업종 <b>H (숙박 및 음식점업)</b> <span class=\"edge\">BORROWED_BY</span>"
                - "제29조 본칙 → 업종 단서 <b>0.9%</b> <span class=\"edge\">HAS_EXCEPTION_PROVISO</span> · Knowledge Catalog 유효 확인"
                - "원장: 기존 100억 · 기적립 8,500만 → 증액 후 250억 × 0.9% − 8,500만"
        reasons_title: "이 차이가 생기는 이유 — 문서 사이의 관계를 그래프에 명시합니다"
        reasons:
          - title: "업무 맥락"
            text: "같은 원장의 '연체율'도 리스크위원회 보고 · 금감원 공시 · 여신관리팀 조기경보마다 1.51% · 2.26% · 4.00%. 부서 × 표준 용어 → 조문 <span class=\"edge\">INVOKES_PROVISION</span>"
          - title: "단서 · 특례 · 위임"
            text: "원칙과 예외, 감독규정과 내규를 엣지로 연결 <span class=\"edge\">HAS_EXCEPTION_PROVISO</span> <span class=\"edge\">DELEGATES_TO_INTERNAL</span>"
          - title: "업권 · 효력"
            text: "저축은행 기준(요주의 2% ≠ 은행 7%) · 폐기 조문은 따라가지 않음 <span class=\"edge\">CONFLICTS_BY_SECTOR</span> · Knowledge Catalog 판정"
        foot: "사실은 한 곳에만 둡니다 — 관계는 <b>그래프</b>, 유효성 · 폐기는 <b>Knowledge Catalog</b>, 조문 본문은 <b>Cloud Storage</b> (3-Plane). 아래 그림이 이 구성을 보여 줍니다."
      figures: ["1"]
    - id: graph
      title: "그래프 아키텍처"
      figures: ["2-1", "2-2", "2-3"]
    - id: agent
      title: "에이전트 아키텍처"
      legend: true
      figures: ["3-1", "3-2"]
      toggle: {label: "시퀀스 다이어그램", options: [{label: "Graph", figure: "3-3"}, {label: "Vector RAG", figure: "3-4"}]}

  figures:
    - id: "1"
      kind: mermaid
      title: "전체 시스템 구성도"
      caption: "왼쪽은 원천 규정과 여신 원장을 적재하는 구축 파이프라인, 오른쪽은 질의를 처리하는 런타임 경로이며, 가운데 3-Plane 이 두 경로를 잇습니다. 두 에이전트는 같은 원천을 서로 다른 방식으로 읽습니다 — Graph Agent 는 위상 그래프(GQL 1회) · Knowledge Catalog(조문 유효성) · Cloud Storage(OKF 원문)를 연결해 읽고, RAG Agent 는 RAG Engine 의 PDF 청크 검색과 SQL 1회로 답합니다."
      sources: [data/build_okf_bundle.py, tools/sync_gcs.py, tools/push_catalog.py, tools/load_stores.py, tools/setup_federation.py, tools/build_ontology_graph.py, tools/studio_server.py]
      mermaid: |
        ---
        config:
          flowchart:
            nodeSpacing: 16
            rankSpacing: 22
        ---
        flowchart LR
          subgraph SRC["원천"]
            PDF["규정 PDF «pdf:count»종"]
            CSV["여신 원장 «ledger:tables»종 · «ledger:rows»행"]
          end
          subgraph BUILD["구축 파이프라인"]
            B1["OKF 번들 생성"]
            B2["원문 적재 · KC 등록"]
            B3["원장 적재 · 연합 구성"]
            B4["개념 · 용어집 · 앵커 구성"]
          end
          subgraph PL["3-Plane"]
            GCS[("원문 Plane<br/>Cloud Storage<br/>OKF")]
            KC[("거버넌스 Plane<br/>Knowledge Catalog<br/>엔트리 · 용어 · 앵커")]
            TOPO[("위상 Plane<br/>BigQuery Graph + Spanner 원장<br/>노드 «total:nodes» · 엣지 «total:edges»")]
          end
          RCP[("비교군 전용<br/>RAG Engine<br/>PDF «rag:files»")]
          subgraph RT["Agent Runtime"]
            GA["Graph Agent"]
            RA["RAG Agent"]
          end
          WEB["Studio"]
          PDF --> B1
          B1 --> B2
          B1 --> B4
          CSV --> B3
          B2 --> GCS
          B2 --> KC
          B4 -->|"용어 · 앵커"| KC
          B4 --> TOPO
          B3 --> TOPO
          PDF -.->|"직접 업로드"| RCP
          B2 ~~~ RCP
          GCS <-->|"서명 URL 원문"| GA
          KC <-->|"조문 유효성"| GA
          TOPO <-->|"GQL 1회"| GA
          TOPO <-->|"SQL 1회"| RA
          RCP <-->|"검색 top-«rag:top_k»"| RA
          GA <--> WEB
          RA <--> WEB
          class GCS,KC,TOPO,RCP store

    - id: "2-1"
      kind: mermaid
      title: "물리 배치"
      caption: "트랜잭션 원장 5종은 Spanner 가 원본이고 BigQuery 는 external dataset(Data Boost)으로 복제 없이 읽습니다. 그래프는 <code>v_node_*</code> · <code>v_edge_*</code> 뷰 위에 선언된 PROPERTY GRAPH 라 원장 변경이 바로 보입니다. 조문 · 문서 노드는 <code>gcs_obj_ref</code>(ObjectRef)로 원문을 가리킵니다."
      sources: [tools/setup_federation.py, tools/load_stores.py, tools/build_ontology_graph.py]
      table: l1_physical     # 클래스 · 노드 뷰 · 원천 테이블 · 저장소 · 라이브 건수 (physical_table COUNT)
      node_order: [BusinessContext, LoanContract, Customer, FinancialProduct, Collateral, DelinquencyEvent, RateCutRequest, ExceptionApproval, WorkoutHistory, Provision, SourceDocument]
      mermaid: |
        ---
        config:
          flowchart:
            nodeSpacing: 22
            rankSpacing: 30
        ---
        flowchart TB
          subgraph SP["Spanner · 원장 원본"]
            S5["loan_contracts · collaterals · delinquency_events<br/>rate_cut_requests · exception_approvals"]
          end
          subgraph BQ1["BigQuery · starlight_bank"]
            EXT["starlight_bank_ext<br/>Spanner external dataset · Data Boost"]
            V5["ont_* 연합 뷰 «bq:ont_views»"]
            M3["customers · financial_products<br/>workout_histories"]
          end
          subgraph BQ2["BigQuery · starlight_bank_ontology"]
            LEX["ctx_business_contexts · lex_source_documents<br/>lex_provisions · edge_* 테이블 «bq:edge_tables»"]
            VW["v_node_* «bq:v_node_views» · v_edge_* «bq:v_edge_views»"]
            PG{{"PROPERTY GRAPH finance_graph"}}
          end
          OBJ[("Cloud Storage · OKF 원문")]
          S5 -.->|"복제 없음"| EXT
          EXT --> V5 --> VW
          M3 --> VW
          LEX --> VW --> PG
          LEX -.->|"OBJ.MAKE_REF"| OBJ
          class S5,OBJ store

    - id: "2-2"
      kind: mermaid
      title: "3-Plane 불변식 — 한 사실은 한 곳에만"
      caption: "그래프 노드(<code>v_node_provision</code>)에는 status · superseded_by 컬럼이 없습니다. 조문 유효성은 질의할 때마다 Knowledge Catalog 에서 판정하고, 원문은 ObjectRef 서명 URL 로만 읽습니다."
      sources: [tools/okf-aspect.json, agents/starlight-graphrag/app/orchestrator/bq_io.py, agents/starlight-graphrag/app/callbacks/guards.py, agents/starlight-graphrag/app/tools/kc_lookup.py, agents/starlight-graphrag/app/services/governance.py]
      plane_check:             # export 가 l1 Provision 속성 + 라이브 뷰 컬럼(INFORMATION_SCHEMA)으로 검사
        has: [provision_slot_id, kc_entry_id, article_no, title, target_columns, gcs_obj_ref]
        lacks: [status, superseded_by, content_class, verified, license]
      mermaid: |
        flowchart LR
          subgraph T["위상 Plane · BigQuery Graph"]
            PV["Provision 노드 · v_node_provision<br/>provision_slot_id · kc_entry_id · article_no<br/>title · target_columns · gcs_obj_ref"]
          end
          subgraph G["거버넌스 Plane · Knowledge Catalog"]
            KE["KC 엔트리 · okf aspect<br/>status · superseded_by · content_class<br/>verified · license"]
          end
          subgraph E["원문 Plane · Cloud Storage"]
            MD["조문 md · OKF<br/>frontmatter + 원문 본문"]
          end
          PV -->|"kc_entry_id"| KE
          PV -->|"gcs_obj_ref → OBJ.GET_ACCESS_URL"| MD
          KE -.->|"superseded_by 체인"| KE
          class KE,MD store

    - id: "2-3"
      kind: trap_paths
      title: "벡터 검색이 놓치는 세 가지를 그래프 경로로"
      caption: "각 엣지와 속성 값은 BigQuery 실데이터(<code>edge_*</code> 테이블)와 대조했고, 아래 GQL 은 검증된 CQ 템플릿(<code>CQ_GQL_TEMPLATES</code>)의 첫 MATCH 경로를 그대로 옮겼습니다."
      sources: [agents/starlight-graphrag/app/orchestrator/engine.py, tools/build_ontology_graph.py]
      panels:
        - id: "2-3a"
          title: "① 단서 · 특례 — CQ09"
          gql_from: CQ09
          text: "본칙(30일 초과 연체 → EOD 예정 통지)만 읽으면 오답. 단서 엣지 조건: 6개월 정상상환 · 유상증자 · 신보 85% 이상 보증서 중 하나 + 우선변제자산 요건 + 본부심사역 승인 시 EOD 유예."
          checks:
            - {edge: INVOKES_PROVISION, ctx: CREDIT_MGMT, term: eod-deferral, dst: "내규 제16조", contains: ["30일"]}
            - {edge: HAS_EXCEPTION_PROVISO, src: "내규 제16조", dst: "내규 제18조", contains: ["연체 30일 초과", "6개월 정상상환", "유상증자", "신보 85% 이상 보증서", "우선변제자산", "본부심사역 승인"]}
          mermaid: |
            ---
            config:
              flowchart:
                rankSpacing: 26
            ---
            flowchart TB
              A["BusinessContext<br/>CREDIT_MGMT · 여신관리팀"] -->|"INVOKES_PROVISION<br/>term_key: eod-deferral"| B["Provision · 내규 제16조<br/>EOD 통지 원칙"]
              B -->|"HAS_EXCEPTION_PROVISO"| C["Provision · 내규 제18조<br/>EOD 유예 특례"]
        - id: "2-3b"
          title: "② 상위 규정 → 내규 위임 — CQ05"
          gql_from: CQ05
          text: "감독규정 제27조의 건전성 · 연체 기준을 내규 제14조가 리스크위 보고용(고정이하) · 공시용(30일 이상, 상각 제외) · EWS용(10일 이상, 상각 포함) 3종 지표로 세분화."
          checks:
            - {edge: INVOKES_PROVISION, ctx: RISK_MGMT, term: delinquency-rate, dst: "제27조"}
            - {edge: DELEGATES_TO_INTERNAL, src: "제27조", dst: "내규 제14조", contains: ["리스크위 보고용(고정이하)", "공시용(30일 이상, 상각 제외)", "EWS용(10일 이상, 상각 포함)", "3종 지표"]}
          mermaid: |
            ---
            config:
              flowchart:
                rankSpacing: 26
            ---
            flowchart TB
              A["BusinessContext<br/>RISK_MGMT · 리스크관리부"] -->|"INVOKES_PROVISION<br/>term_key: delinquency-rate"| B["Provision · 감독규정 제27조<br/>자산건전성분류"]
              B -->|"DELEGATES_TO_INTERNAL"| C["Provision · 내규 제14조<br/>연체율 3종 지표"]
        - id: "2-3c"
          title: "③ 같은 용어 · 부서별 다른 기준 — CQ06 · CQ07"
          gql_from: CQ06
          text: "term_key 는 같아도 부서마다 엣지 속성이 다른 산식을 가리킵니다: 여신관리팀 EWS 4.00% / 대외공시 2.26%. 국회입법조사처 브리프의 거시 가계대출 연체율 0.24% 는 <code>CONFLICTS_BY_SECTOR</code> 로 혼입 금지."
          checks:
            - {edge: INVOKES_PROVISION, ctx: CREDIT_MGMT, term: delinquency-rate, dst: "내규 제14조", contains: ["4.00%"]}
            - {edge: INVOKES_PROVISION, ctx: DISCLOSURE, term: delinquency-rate, dst: "내규 제14조", contains: ["2.26%"]}
            - {edge: CONFLICTS_BY_SECTOR, src: "내규 제14조", dst_doc: DOC_07_NARS_RATE, contains: ["2.26%", "0.24%", "혼입 인용 금지"]}
          mermaid: |
            ---
            config:
              flowchart:
                nodeSpacing: 14
                rankSpacing: 26
            ---
            flowchart TB
              M["BusinessContext<br/>CREDIT_MGMT"] -->|"delinquency-rate<br/>EWS 4.00%"| P["Provision · 내규 제14조"]
              D["BusinessContext<br/>DISCLOSURE"] -->|"delinquency-rate<br/>공시 2.26%"| P
              P -->|"CONFLICTS_BY_SECTOR"| X["Provision · 국회입법조사처 브리프<br/>거시 연체율 0.24% · 혼입 금지"]
              class X stop

    - id: "3-1"
      kind: mermaid
      title: "컴포넌트 설계도"
      caption: "자율 루프 대신 결정론 오케스트레이터가 실행 순서와 도구 예산(최대 «cfg:tool_budget»회)을 통제합니다. Gemini 는 질의 플래닝 · GQL 교정 · 최종 브리핑 합성 3곳(파란색)에서만 호출되며, 모든 그래프 조회(최대 «cfg:max_graph_hops» hop)와 원문 인출은 가드레일 콜백을 통과해야 실행됩니다."
