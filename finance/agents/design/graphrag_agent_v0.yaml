# ----------------------------------------------------------------------------
# 2. ADK 토폴로지 (D1 확정: 단일 통합 GraphRAG 파이프라인)
# ----------------------------------------------------------------------------
topology:
  recommended: A_unified_graphrag_pipeline
  options:
    A_unified_graphrag_pipeline:
      summary: "[채택 · v0.3.0 일원화] product vs eval_arm 인위적 분리를 제거한 단일 통합 GraphRAG 에이전트. Alias & KC 고정 템플릿 바인딩 → GQL 플래너 + BQ Dry-Run 검증 → KC 유효성 게이트 → 통합 GQL(graph_query) & ObjectRef(fetch_provision) 3대 도구로 고객 데모와 벤치마크 평가를 동일하게 수행."
      pros: [데모 에이전트와 평가 에이전트 100% 일치, 별도 bigquery_sql 없이 GQL 한 번으로 그래프+원장 통합 질의, BigQuery Dry-Run 으로 실행 전 문법·스키마 100% 검증]
      cons: [향후 결정론적 StateGraph 전환 시 app/assemblies/__init__.py 의 build() 만 교체]
    B_adk2_graph_workflow:
      summary: "ADK 2.0 Workflow: resolve → plan_and_dry_run_gql → kc_govern → execute_gql_and_fetch → compose 결정론 노드 (assemblies/__init__.py 의 차기 교체 후보)"
      pros: [감사 가능성 최상, 게이트 생략 불가]
      cons: [프로토타입 1차 검증 후 assemblies 레이어에서 무수정 전환 가능]
    C_multi_agent:
      summary: "Router + Context/LEX/Ledger 서브에이전트"
      pros: [역할 분리]
      cons: [12 tool-call 예산 내 오버헤드, 현 규모(11 class)에 과잉]

agent:
  name: starlight_graphrag
  model: "gemini-3.8-flash (agents-cli scaffold 확정 · app/agent.py MODEL 상수)"
  generate_content_config: {temperature: 0, seed: 20260927}
  instruction_blocks:
    - common_skeleton      # 공통 원칙 (역할·인용 형식·수치 계산·폐기 조문 추측 금지)
    - graph_tools          # 단일 통합 GQL 파이프라인 지침 (KC 고정 템플릿 + BQ Dry-Run + KC 유효성 게이트)
    - schema_card          # KC ontology-class-anchors (v1.2.0, 11/11 키 바인딩) → {app:schema_card}
    - blocked_notice       # [D5] KC 유효성 검증 실패(BLOCKED_DEPRECATED) 시 답변 불가 및 신속 조치 안내 템플릿

# ----------------------------------------------------------------------------
# 3. 도구 3종 (eval_questions.yaml v1.2.0 protocol.arms.graphrag.tools 와 1:1 고정 — v1.1.0 과 동일)
#    ※ bigquery_sql 은 RAG 에이전트 전용이며, GraphRAG 는 GQL 한 번으로 원장까지 통합 조회함
# ----------------------------------------------------------------------------
tools:
  graph_query:
    plane: "BigQuery Property Graph (Unified GQL Planner + BQ Dry-Run)"
    input: "gql: str  — 'GRAPH starlight_bank_ontology.finance_graph MATCH ... RETURN ...' 또는 'SELECT ... FROM GRAPH_TABLE(starlight_bank_ontology.finance_graph MATCH ... COLUMNS (...))'"
    output: "dry_run_bytes, rows[], touched_ids{provision_slot_id[], kc_entry_id[], contract_id[]}"
    guards:
      - "KC ontology-class-anchors 의 고정 gql_match_template($CANONICAL_ID) 시작 노드 앵커링"
      - "Stage A 정적 검증 (gql_composer.validate): GRAPH / GRAPH_TABLE 접두, 읽기 전용, 11C·15E 라벨, 단일 체인 ≤12-hop · 스타스키마 멀티 브랜치 ≤24-edge · 무제한 Kleene(*) 차단, LIMIT≤200"
      - "Stage B BigQuery Dry-Run 검증 (GraphPort.dry_run_gql, dry_run=True): 실행 전 GQL 문법·속성명·타입·바이트 예산(≤2GB) 사전 검증"
      - "Module 04 방식 단일 통합 실행: 부서 맥락·조문 순회 + Spanner 연합 원장(ont_*) 정량 계산 + OBJ.GET_ACCESS_URL 서명 URL 추출을 GQL 한 번에 처리"
  kc_lookup:
    plane: "Dataplex Knowledge Catalog (OKF 유효성 게이트)"
    input: "kc_entry_id: str"
    output: "verdict ALLOW | SUPERSEDED_RESOLVED(active_entry_id) | BLOCKED_DEPRECATED , status(stable/verified vs deprecated), version, chain[]"
    impl_seed: "app/services/governance.py (status ∈ {'stable', 'verified'} → 통과 / deprecated → superseded_by ≤3-hop 추적 / 대체본 없음 → BLOCKED_DEPRECATED 답변 불가)"
  fetch_provision:
    plane: "GCS via BigQuery ObjectRef (D4 서명 URL 원문 조회)"
    input: "provision_slot_id: str"
    output: "verbatim_body, section_number, source_page, doc_id, sha256_ok, gcs_uri"
    precondition: "동일 세션에서 해당 kc_entry_id 의 kc_lookup verdict ∈ {ALLOW, SUPERSEDED_RESOLVED} 통과 필수 + OBJ.GET_ACCESS_URL(gcs_obj_ref, 'r') 서명 URL 경유"

pre_grounding:
  entity_resolution: "[D3 확정: before_agent 콜백 채택] Input 유입 즉시 ont_entity_aliases(438 rows) 최장일치 해석 + BQG KC Aspect(ontology-class-anchors v1.2.0)의 고정 gql_match_template($CANONICAL_ID) 바인딩 (<1ms, 도구 예산 0 소모, 결정론 100%) → {temp:resolved_entities} 및 {app:schema_card} 주입"
  decision_criteria_d3:
    latency: "콜백(<1ms 인메모리 매칭) vs 별도 도구(+1.5~3.0초 추가 LLM 왕복 1회)"
    determinism: "콜백(100% 결정론적 최장일치 — '별빛' 접두어가 '별빛 프라임 중견기업 운전자금'을 가리는 현상 원천 차단 + KC 고정 GQL 템플릿 즉시 결합) vs 별도 도구(LLM 인자 변형 위험)"
    budget_and_protocol: "콜백(12회 도구 예산 소모 0) vs 별도 도구(예산 1회 차감)"

# ----------------------------------------------------------------------------
# 4. 콜백 가드레일 & D5 거버넌스 차단 대응 아키텍처
# ----------------------------------------------------------------------------
callbacks:
  before_agent: [load_schema_card_from_kc, load_alias_cache, pre_ground_user_query_with_kc_template]
  before_tool:
    - tool_budget_12          # 초과 시 도구 차단 + 현재 증거로 답변 지시
    - gql_dry_run_guard       # graph_query 실행 전 정적 검증 + BigQuery QueryJobConfig(dry_run=True) 사전 검증
    - governance_gate         # fetch_provision 은 kc_lookup verdict ∈ {ALLOW, SUPERSEDED_RESOLVED} 선행 필수
  after_tool:
    - evidence_ledger         # temp:evidence[] ← node/edge/provision/kc verdict/gcs uri 기록
    - emit_governance_incident # [D5] kc_lookup 결과 BLOCKED_DEPRECATED 발생 시 IncidentSinkPort.emit(GovernanceIncident) 호출 및 temp:blocked 마킹
  after_model:
    - blocked_notice_policy   # [D5] KC 유효성 검증 실패(temp:blocked) 시 답변 불가 처리 — 추측 답변을 폐기하고 접수번호(INC-...) 포함 고객 신속 조치 안내문 반환
    - citation_check          # 문서 id(01~10) + 쪽/조문 표기 누락 시 1회 재작성
  non_blocking_policy: "distractor(09) 문서는 차단하지 않고 authority 라벨만 부착 (EQ13 과잉차단 방지)"

# ----------------------------------------------------------------------------
# 5. 검증 게이트 (주장하지 말고 측정)
# ----------------------------------------------------------------------------
gates:
  CQ_G8_labels: "[PASS 20/20 · NC4 PASS] CQ 20개 graph_path 의 모든 노드·엣지 라벨이 ontology/l1.yaml (11C·15E)와 100% 정합"
  EQ_G1_G6_eval: "[PASS 6/6 · NC1~NC4 PASS · 2026-09-28 재측정] eval_questions.yaml v1.2.0 (RAG=RAG Engine+SQL vs GraphRAG=Unified GQL+KC+ObjectRef) 사전등록 검증 통과 — G2 10/10 (EQ01 정답 쿼리 1개 추가). v1.2.0 의 사후 수정은 ADR 0013 에 공개"
  U1_unit_arch: "[PASS 12/12 · 2026-09-28] agents/starlight-graphrag/tests/unit — 3대 도구 시그니처(graph_query/kc_lookup/fetch_provision), 최장일치 별칭 해석, KC 고정 템플릿 바인딩, GQL 정적+BigQuery Dry-Run 검증, D5 인시던트 싱크 검증 등"
  T1_alias: "에이펙스세미콘→CUST_0008, 연체율→term_key delinquency-rate 등 438개 별칭 기준값 재현"
  T2_reach: "CQ 20개 graph_path 를 단일 통합 GQL(graph_query + BQ Dry-Run)로 실제 도달 및 정량 산출"
  T3_kc: "art_029 ALLOW (status: stable), superseded_by 체인(≤3-hop) 해석 및 BLOCKED_DEPRECATED 차단"
  T4_fetch: "fetch_provision ObjectRef 서명 URL 본문 sha256 = frontmatter digest (174/174 · 2026-09-27 측정 — doc05 재분절 ADR 0014 이후 조문 178개 기준 재측정 안 함)"
  T5_guard_nc: "DML·미등록 라벨·Dry-Run 실패·예산 13회차·kc 미검증 fetch·BLOCKED_DEPRECATED 강행이 모두 차단되어야 PASS (음성 대조)"
  T6_eval: "agents-cli eval 로 transcript 생성 → tools/verify_eval.py 결정론 정규식 채점"

# ----------------------------------------------------------------------------
# 6. 확정된 의사결정 (D1~D7 — v0.3.0 단일 통합 GQL 파이프라인 반영 완료)
# ----------------------------------------------------------------------------
open_decisions:
  D1: "[확정 · 단일 통합 GraphRAG 에이전트] product 와 eval_arm 의 인위적 분리를 제거. RAG 에이전트는 (GCP Vertex AI RAG Engine PDF + BigQuery SQL)로, 우리의 GraphRAG 에이전트는 (Alias & KC 고정 GQL 템플릿 → GQL 플래너 + BQ Dry-Run → KC 유효성 게이트 → 통합 GQL & ObjectRef) 단일 구조로 데모와 평가를 모두 수행."
  D2: "[확정 · 통합 GQL 플래너 + BigQuery Dry-Run 검증 (별도 bigquery_sql 제거)] finance_graph 내부에 Spanner 연합 원장(ont_*)과 BQ 원장 8종이 모두 노드·엣지로 통합되어 있으므로 별도 bigquery_sql 도구를 두지 않고 Module 04 처럼 GQL 한 번(GRAPH / GRAPH_TABLE)으로 다중홉 규정 탐색과 정량 집계를 함께 처리. 생성된 GQL 은 실행 전 정적 검증 + BigQuery Dry-Run(dry_run=True)으로 검증."
  D3: "[확정 · before_agent 콜백 사전 바인딩] Input 유입 시 ont_entity_aliases(438행) 최장일치 탐색과 BQG KC Aspect(ontology-class-anchors v1.2.0) 고정 gql_match_template($CANONICAL_ID) 바인딩을 before_agent 콜백에서 <1ms(예산 0 소모)로 수행하여 GQL 플래너에 전달."
  D4: "[확정 · BigQuery ObjectRef 서명 URL 경유] v_node_provision.gcs_obj_ref 에 대해 OBJ.GET_ACCESS_URL(gcs_obj_ref, 'r') 서명 URL 을 발급받아 원문을 조회함으로써 BigQuery Graph 가 정형·비정형 접근을 단일 중개."
  D5: "[확정 · KC 유효성 검증 실패 시 답변 불가 + 신속 조치 안내 + 비동기 통지 포트] OKF 조문 참조 시 kc_lookup 으로 KC 유효성을 검증하여 통과 못하면(BLOCKED_DEPRECATED) 즉시 답변 불가 처리 후 고객 신속 조치 안내문(접수번호 포함)을 출력하고, IncidentSinkPort(현재 LogIncidentSink → 차기 Pub/Sub → BQ → 배치 알림)로 비동기 이벤트를 발행."
  D6: "[확정 · 로컬 프로토타입 우선] agents-cli scaffold create --prototype 으로 로컬 검증을 먼저 완료한 뒤 추후 Agent Runtime 배포로 확장."
  D7: "[확정 · 리팩토링 가능한 헥사고날 디렉터리 구조] agents/starlight-graphrag/ 아래 domain · ports(5종) · services(5종) · adapters · tools(3종) · callbacks · prompts · assemblies 레이어로 분리하여 교체 지점(Swap Points)을 모듈화."
  D8: "[확정 · 2026-09-28 · ADR 0013 · v0.3.1] 자유 질의 경로 수정 4건 (사용자 승인 00:49Z·00:51Z·01:16Z). (a) 사전작성 CQ 브리핑·CQ 근거 인용은 수정하지 않은 사이드바 클릭(requested_num)에만 쓴다. (b) OUT_OF_DOMAIN 거절은 '업무 범위 밖'으로만 설명하고 자료 보유 여부를 단정하지 않는다. (c) 플래너에 v_node_provision 라이브 조문 카탈로그(kc_entry_id | title)를 주고, 목록에 없는 슬롯 ID 는 버리며 최대 4개만 쓴다. (d) 브리핑에 조문 본문 전체(verbatim_body)를 넘긴다 (이전 900자 절단). 관련 데이터 수정: 본문과 어긋난 OKF 조문 제목 6건 정정(ID 불변, data/review/okf_title_fixes_v1.yaml)."

# ----------------------------------------------------------------------------
# 6-1. 자유 질의 경로 (v0.3.1 · D8) — 사이드바 CQ 클릭과 자유 질의가 갈리는 지점
# ----------------------------------------------------------------------------
free_question_path:
  code: agents/starlight-graphrag/app/orchestrator/engine.py
  sidebar_cq_click: "requested_num 이 있고 질문을 고치지 않은 경우 → CQ 사전검증 자산(브리핑·근거 인용) 사용 (use_cq_assets=True)"
  free_question: "requested_num 없음 → 플래너가 모드·조문 슬롯·GQL 을 정하고 매 턴 라이브 도구로 답한다 (use_cq_assets=False)"
  changes:
    a_canned_assets_sidebar_only: "use_cq_assets = cq_obj is not None and bool(requested_num)"
    b_out_of_domain_wording: "거절 사유 = 업무 범위 밖. '보유하고 있지 않다' 류 표현 금지 (플래너 지침)"
    c_live_provision_catalog: "_load_provision_catalog: v_node_provision 의 kc_entry_id·title 을 실행 중 읽음 (캐시 600초) → 플래너 입력 provision_catalog. 목록 밖 슬롯 ID 는 버림, 최대 _MAX_PLANNER_PROVISION_SLOTS=4"
    d_full_body_briefing: "_gemini_synthesize_briefing 에 verbatim_body 전체 전달 (2026-09-28 측정 당시 조문 174개 모두 900자 초과 — 중앙값 1,790자, 최대 5,661자)"
  trace_fields: [dropped_provision_slots, used_canned_cq_assets]
  unchanged:
    - "Q21 만료 조문 거절 경로 · score==100 경로"
    - "CQ 로 매핑된 자유 질의(score ≥45)의 검증된 GQL 템플릿 재사용 — 답이 아니라 쿼리를 재사용 (ADR 0013 에 공개)"
  residuals:
    - "ID slug 가 본문과 어긋나는 경우는 남는다 (예: annex3_item_06_07_workout_special_rules) — ID 는 불변 위상 키"
    - "제목–본문 일치 여부를 검사하는 lint 는 제안만 됨 (미구현)"
  measured_local_2026_09_28: "로컬 20-EQ (scratch/eq_graphrag_local_v2.py): 버린 슬롯 0/20 · 사전작성 답변 0/20 · 도구 호출 ≤11 (예산 12) · unit 12 passed"

# ----------------------------------------------------------------------------
# 7. 리팩토링 가능한 디렉터리 구조 및 교체 지점 (D7 · agents/starlight-graphrag)
# ----------------------------------------------------------------------------
directory_architecture:
  root: agents/starlight-graphrag
  pattern: "Ports & Adapters (Hexagonal) — Unified Single-Pipeline GraphRAG"
  layers:
    - path: "app/config.py"
      role: "환경변수 기반 Settings (프로젝트·데이터셋·그래프·KC·Dry-Run 바이트 상한 등 단일 관리, 하드코딩 0)"
      swap_point: "환경변수(.env) 변경만으로 개발/스테이징/프로덕션 및 STARLIGHT_INCIDENT_SINK 전환"
    - path: "app/domain/ (models.py, state_keys.py)"
      role: "순수 도메인 값 객체(ResolvedEntity, SchemaCard, GqlDryRunResult, KcVerdict, ProvisionText, GovernanceIncident) 및 세션 상태 키 상수"
      swap_point: "GCP/ADK 의존성 0 — 모든 레이어가 공유하는 불변 계약"
    - path: "app/ports.py"
      role: "5대 외부 경계 Protocol 인터페이스 (GraphPort[dry_run_gql + run_gql], ObjectRefPort, CatalogPort, AliasSourcePort, IncidentSinkPort)"
      swap_point: "단위 테스트 시 In-Memory Fake 주입 · 운영 시 GCP 어댑터 주입"
    - path: "app/services/ (alias_resolver, gql_composer, governance, provision_reader, schema_card)"
      role: "순수 비즈니스 정책 로직 (최장일치 별칭 해석, KC 고정 템플릿 바인딩 + GQL 정적/Dry-Run 검증, KC 유효성/대체 체인 판정, ObjectRef 원문 파싱)"
      swap_point: "ADK 버전을 올리거나 에이전트 토폴로지를 바꿔도 수정 불필요"
    - path: "app/adapters/ (bigquery.py, dataplex.py, incident_sinks.py)"
      role: "GCP SDK 구현체 (BigQuery Graph Dry-Run/Execute/ObjectRef, Dataplex KC, LogIncidentSink / PubSubIncidentSink)"
      swap_point: "D5 후속 작업 시 incident_sinks.py 의 PubSubIncidentSink 만 구현 후 STARLIGHT_INCIDENT_SINK=pubsub 로 전환"
    - path: "app/tools/ (graph_query, kc_lookup, fetch_provision)"
      role: "ADK 도구 얇은 래퍼 3종 (별도 bigquery_sql 없음 — 모든 정형·비정형 그래프 질의는 graph_query 로 일원화)"
      swap_point: "도구 시그니처 3종 불변 유지"
    - path: "app/callbacks/ (grounding.py, guards.py, answer.py)"
      role: "before_agent(Alias + KC 고정 템플릿 바인딩), before_tool(12회 예산·GQL Dry-Run 검증·KC 선행 게이트), after_tool(증거 원장·D5 인시던트 발행), after_model(D5 답변 불가 안내문·인용 검사)"
      swap_point: "가드레일 정책 독립 조합"
    - path: "app/assemblies/ (__init__.py)"
      role: "단일 통합 GraphRAG 에이전트 조립소 (product/eval_arm 분리 없이 하나의 starlight_graphrag 생성)"
      swap_point: "향후 ADK 2.0 결정론 그래프 워크플로 도입 시 app/assemblies/__init__.py 의 build() 만 교체"
    - path: "app/agent.py"
      role: "ADK 엔트리포인트 (MODEL='gemini-3.8-flash', root_agent_name='starlight_graphrag' 고정)"
      swap_point: "agents-cli manifest 불변 계약 준수"

