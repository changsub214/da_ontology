#     sequence_lifelines · sequence_scenarios("LLM 이 도구를 고르는" 모델)는 삭제하고 결정론 엔진 기준 그림으로 교체.
#     측정 블록 412/1,442 → 416/1,446 (doc05 재분절 ADR 0014 이후) · 개념 184 → 188 정정. KC 엔트리 · GCS md 는
#     export 게이트(G1)가 잡은 대로 시연 고정물 포함 총계로 정정: KC 233 (번들 229 + 고정물 4) · md 232 (로컬 229 + 고정물 3).
#     에이전트 코드·토폴로지 변경 없음.
#   - v0.3.3 (2026-09-29, ADR 0016): Step 1 = 검증(정적 검사 + BigQuery dry-run) → 통과할 때까지 _gemini_repair_gql
