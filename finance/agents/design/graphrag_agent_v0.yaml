    - id: "3-2"
      kind: mermaid
      title: "순서도 — Step 0–3 결정론적 실행 흐름"
      caption: "에이전트 한 턴의 결정론적 실행 흐름입니다(모듈 05 · 06 의 Step 0–3 실행 내역과 동일). Step 1 은 정적 검사(≤«cfg:max_graph_hops» hop)와 BigQuery Dry-Run 을 통과할 때까지 최대 «cfg:max_gql_repairs»회 자동 교정한 뒤 통과한 GQL 만 딱 1회 실행하며, Step 2 에서 폐기 · 미등록 조문이 감지되면 원문 인출 전에 즉시 답변을 차단합니다."
      sources: [agents/starlight-graphrag/app/orchestrator/, agents/starlight-graphrag/app/callbacks/, agents/starlight-graphrag/app/services/,
                agents/starlight-graphrag/app/adapters/, agents/starlight-graphrag/app/domain/, tools/agent_remote_client.py]
      mermaid: |
        ---
        config:
          flowchart:
            nodeSpacing: 16
            rankSpacing: 22
        ---
        flowchart LR
          Q0(["질문 수신"]) --> S0["Step 0 · 그라운딩 · 플래닝<br/>표준 용어 · 차주 앵커 바인딩"]
          S0 -->|"도메인 외 · 도움말"| R0["안내 응답 · 도구 0회"]
          S0 -->|"심사 질의"| S1["Step 1 · GQL 검증 · 실행<br/>≤«cfg:max_graph_hops» hop + Dry-Run → GQL 1회"]
          S1 -->|"Dry-Run 실패 · ≤«cfg:max_gql_repairs»회"| RP["GQL 자동 교정<br/>오류 · 이전 시도 반영"]
          RP --> S1
          S1 -->|"«cfg:max_gql_repairs»회 소진 · 반복"| RF["답변 거절 · GQL 미실행"]
          S1 -->|"검증 통과"| S2["Step 2 · KC 유효성 판정<br/>조문 상태 · 대체 조문 확인"]
          S2 -->|"폐기 · 미등록"| BN["GovernanceIncident 발행<br/>원문 인출 차단 · 거절 응답"]
          S2 -->|"유효(ALLOW)"| S3["Step 3 · OKF 원문 인출<br/>ObjectRef 서명 URL → GCS"]
          S3 --> SB["심사 브리핑 합성<br/>인용 검증 · 최종 답변"]
          class S0,RP,SB llm
          class R0,RF,BN stop
          class Q0 term

    - id: "3-3"
      kind: mermaid
      title: "시퀀스 다이어그램 — Graph"
      caption: "단계가 진행될 때마다 실시간 진행 상태가 Studio 화면으로 스트리밍되고, 마지막에 답변 · 증거 원장 · Knowledge Catalog 판정 · 조문 원문이 함께 반환됩니다. 조문 원문은 BigQuery ObjectRef 서명 URL 을 통해 Cloud Storage 에서 직접 인출합니다."
      sources: [tools/studio_server.py, tools/agent_remote_client.py, agents/starlight-graphrag/app/agent.py, agents/starlight-graphrag/app/orchestrator/,
                agents/starlight-graphrag/app/callbacks/, agents/starlight-graphrag/app/services/, agents/starlight-graphrag/app/adapters/, agents/starlight-graphrag/app/domain/]
      mermaid: |
        sequenceDiagram
          autonumber
          actor U as 사용자
          participant W as Studio
          participant O as Graph Agent<br/>결정론 오케스트레이터
          participant G as Gemini 3.8 Flash
          participant B as BigQuery Graph
          participant K as Knowledge Catalog
          participant C as Cloud Storage (OKF)
          U->>W: 질문 입력
          W->>O: 질의 요청 (스트리밍)
          Note over O: Step 0 · 표준 용어 · 차주 앵커 바인딩
          O->>G: 질의 플래닝 (모드 · GQL · 조문 슬롯)
          G-->>O: 실행 계획 반환
          alt 도메인 외 · 도움말 질의
            O-->>W: 안내 응답 (도구 0회)
          else 원장 조회 · Graph 심사 질의
            O->>B: Step 1 · GQL Dry-Run 검증
            opt Dry-Run 실패 시 (최대 «cfg:max_gql_repairs»회)
              O->>G: GQL 교정 요청 (오류 · 이전 시도 전달)
              G-->>O: 교정된 GQL
              O->>B: Dry-Run 재검증
            end
            O->>B: 통과한 GQL 1회 실행
            B-->>O: 원장 데이터 · 조문 슬롯 반환
            opt 규정 조문 포함 심사 질의
              O->>K: Step 2 · 조문 슬롯별 유효성 조회
              K-->>O: 상태(ALLOW · DEPRECATED) · 대체 조문
              alt 폐기 · 미등록 조문 감지
                O-->>W: GovernanceIncident 발행 및 답변 차단
              else 유효 조문 (ALLOW)
                O->>B: Step 3 · ObjectRef 서명 URL 발급
                B-->>O: 서명 URL
                O->>C: 정본 조문 원문 인출
                C-->>O: OKF 조문 전문
              end
            end
            O->>G: 원장 + 조문 전문 기반 심사 브리핑 합성
            G-->>O: 최종 답변 (인용 검증 완료)
            O-->>W: 최종 답변 · 단계별 근거 반환
          end
          W-->>U: Step 0–3 실행 내역 · 답변 표시
