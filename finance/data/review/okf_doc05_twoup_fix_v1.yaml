method:
  extraction: >-
    For doc 05 only, cut every sheet at x = 420 pt (page width 841 pt; the left column ends at x ≤ 392 and the right
    column starts at x ≥ 471) and run pdftotext -x/-y/-W/-H on the left half, then the right half. The two texts
    are joined with a blank line. Sheet numbering, and therefore source_page, is unchanged.
  builder_change: >-
    data/build_okf_bundle.py: extract_pdf_pages(pdf, two_up_split_x=None). build_bundle() passes
    doc_spec.get("two_up_split_x"), and only the doc 05 spec sets it (420). Other documents use the same code path as today.

