# OKF 조문 제목·설명 수정안 — 사용자 검토용 (적용 전)
#
# 배경 (2026-09-28, log 참조): GraphRAG 플래너는 `kc_entry_id | title` 목록을 보고 조문을 고른다.
# 아래 조문들은 본문(원문 발췌, P1–P4 검증 완료)은 맞지만 제목·설명이 다른 내용을 가리킨다.
# 예: EQ16 정답("① 가①의 경우 : 기한이익 상실일")이 있는 조문의 제목이 "기업구조조정 … 특례"라서
# 플래너가 한 번도 고르지 않았다 (0/2). RAG 는 본문 임베딩으로 찾는다.
#
# 원칙
#   - 본문(verbatim)은 건드리지 않는다. 바꾸는 것은 제목·설명이다 (본문과 어긋난 경우에만 section_number 도).
#   - ID 는 바꾸지 않는다: prov_id = kc_entry_id = 파일 경로 = 그래프 provision_slot_id 는 불변 위상 키 (AGENTS.md 불변식).
#     slug(예: workout_special_rules)가 내용과 어긋나는 것은 남는다 → residuals 참조.
#   - 원문에 제목이 있으면 그 제목을 그대로 쓴다. 없으면 본문에 있는 주제를 중립적으로 요약한다.
#     EQ 정답 문구를 제목·설명에 넣지 않는다 (예: "기한이익 상실일"은 설명에 넣지 않음).
#   - SSOT 는 data/build_okf_bundle.py 의 DOC_SPECS 이다. 이 YAML 은 검토·변경 기록용이며 빌더가 읽지 않는다.
#
# 발견 방법: 제목 단어가 본문에 나오는 비율(편집 제목 85개 대상). 1/3 미만 9개를 원문 PDF 와 대조해 읽었다.
#   → 불일치 6건(change), 불일치 아님 2건(keep), 선택 1건(optional).

