  "04": {file: "04_FSC_은행업감독규정_개정안_규정변경예고_거액익스포져.pdf", authority: advisory}
  "05": {file: "05_FSC_KFB_은행권_대출금리_산정체계_개선방안.pdf", authority: advisory}
