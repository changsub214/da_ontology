  "09": {file: "09_DISTRACTOR_상호저축은행업감독규정_규제영향분석서.pdf", authority: distractor}
  "10": {file: "10_SYNTHETIC_별빛은행_기업여신심사_및_금리운영_내규.pdf", authority: internal}

# 공통 정의 (SQL 에서 반복 사용)
#   on-BS(대차대조표 내) 여신 = account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
#   고정이하 = asset_classification IN ('SUBSTANDARD','DOUBTFUL','ESTIMATED_LOSS')

cqs:
# ============================================================================
# A. 건전성 분류 · 대손충당금
# ============================================================================
- id: CQ01
  theme: A
  cq_type: multi_hop
  question: "이번 분기 결산에서 '정상' 여신에 대해 대손준비금을 추가로 쌓아야 해? 쌓아야 하면 얼마고, 어느 계좌 때문이야?"
  business_context: {id: RISK_MGMT}
  why_hard: "정상 원칙(0.85%) 뒤에 붙은 업종 단서(F·G·H·L 0.9%)를 읽고, 차주 마스터의 KSIC 로 원장 계좌를 골라, 건전성분류별 합계를 장부 충당금과 비교해야 한다. 질문에는 업종도 계좌도 없다."
  trap: "0.85% 만 적용하면 '추가 적립 없음' 으로 오답. 가계 1.0%(제29조①2호)를 가져오면 과다 산출."
  evidence:
    - {doc: "01", page: 20, locator: "제29조제1항 본문", authority: binding, role: rule,
       quote: '건전성분류별로 각각 산출된 금액'}
    - {doc: "01", page: 20, locator: "제29조제1항 본문", authority: binding, role: rule,
       quote: '그 차액을 매 결산시(분기별 가결산을 포함한다)마다 대손준비금으로 적'}
    - {doc: "01", page: 20, locator: "제29조제1항제1호가목 단서", authority: binding, role: exception,
       quote: '한국표준산업분류상 건설업(F), 도매 및 소매업(G), 숙박 및 음식점업(H), 부동산 및 임대업(L)은 100분의 0.9 이상'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, customer_id, outstanding_amt, asset_classification, booked_provision_krw, account_status]}
    - {table: customers, source_store: bigquery, columns: [customer_id, borrower_name, ksic_section_code]}
  answer_queries:
    - sql: |
        WITH n AS (
          SELECT l.contract_id, l.outstanding_amt, l.booked_provision_krw,
                 DIV(l.outstanding_amt * IF(c.ksic_section_code IN ('F','G','H','L'), 90, 85), 10000) AS required_min_krw
          FROM {ds}.ont_loan_contracts l JOIN {ds}.customers c USING (customer_id)
          WHERE l.asset_classification = 'NORMAL' AND l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM')
        SELECT COUNT(*) AS normal_contracts, SUM(outstanding_amt) AS normal_outstanding_krw,
               SUM(required_min_krw) AS required_min_total_krw, SUM(booked_provision_krw) AS booked_total_krw,
               GREATEST(SUM(required_min_krw) - SUM(booked_provision_krw), 0) AS reserve_topup_krw
        FROM n
      expect: {scalar: {reserve_topup_krw: 30000000}}
    - sql: |
        SELECT l.contract_id, c.borrower_name, c.ksic_section_code, l.outstanding_amt, l.booked_provision_krw,
               DIV(l.outstanding_amt * 90, 10000) - l.booked_provision_krw AS gap_krw
        FROM {ds}.ont_loan_contracts l JOIN {ds}.customers c USING (customer_id)
        WHERE l.asset_classification = 'NORMAL'
          AND l.booked_provision_krw < DIV(l.outstanding_amt * IF(c.ksic_section_code IN ('F','G','H','L'), 90, 85), 10000)
        ORDER BY gap_krw DESC
      expect:
        exact_rows: 4
        sum: {gap_krw: 30000000}
        must_contain: [{contract_id: LN_2026_KSIC_L1, gap_krw: 10000000}, {contract_id: LN_2026_KSIC_H1, gap_krw: 5000000}]
  answer: "추가 적립 필요 — 3,000만 원. F·G·H·L 4개 차주(대양피에프개발 L 200억, 삼호종합건설 F 150억, 한일유통상사 G 150억, 그랜드하모니호텔 H 100억)가 장부상 0.85% 로만 적립돼 있어 단서 기준 0.9% 대비 각 1,000만/750만/750만/500만 원 부족. 정상 분류 합계 기준 차액이 제29조① 에 따라 대손준비금 대상."
  graph_path: "(:BusinessContext{context_id:'RISK_MGMT'})-[:INVOKES_PROVISION{term_key:'provision-criteria'}]->(:Provision{art_029})-[:HAS_EXCEPTION_PROVISO]->(:Provision{art_029_1_1_a_proviso}) ; (:BusinessContext{context_id:'RISK_MGMT'})-[:SCOPES_PORTFOLIO]->(:LoanContract{asset_classification:'NORMAL'})-[:BORROWED_BY]->(:Customer{ksic_section_code IN ('F','G','H','L')})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S2

- id: CQ02
  theme: A
  cq_type: exception_path
  question: "'고정'으로 분류된 여신들 법정 최소 충당금이 얼마야? 지금 장부에 쌓인 것과 비교하면 부족해, 남아?"
  business_context: {id: RISK_MGMT}
  why_hard: "고정 20% 원칙에 우선변제자산 10% 단서가 붙고, 어떤 계좌가 우선변제자산인지는 원장 플래그와 회생·워크아웃 이력에서 확인해야 한다."
  trap: "두 계좌 모두 20% 로 계산(40억 필요)하거나 둘 다 10% 로 감경(20억)."
  evidence:
    - {doc: "01", page: 20, locator: "제29조제1항제1호다목", authority: binding, role: rule,
       quote: '"고정"분류 자산의 100분의 20 이상'}
    - {doc: "01", page: 20, locator: "제29조제1항제1호다목 단서", authority: binding, role: exception,
       quote: '제180조제2항에 따라 은행이 우선하여 변제받을 권리가 인정되는 자산(이하 "우선변제자산"이라 한다)은 100분의 10 이상'}
    - {doc: "02", page: 1, locator: "별표3 1.다②", authority: binding, role: definition,
       quote: '3월 이상 연체대출채권을 보유하고 있는 거래처에 대한 자산중 회수예상가액 해'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, borrower_name, overdue_days, outstanding_amt, asset_classification, rehab_priority_claim_yn, booked_provision_krw, account_status]}
    - {table: workout_histories, source_store: bigquery, columns: [contract_id, legal_proceeding_code]}
  answer_queries:
    - sql: |
        SELECT l.contract_id, l.borrower_name, l.overdue_days, l.rehab_priority_claim_yn,
               IFNULL(w.legal_proceeding_code, 'NONE') AS legal_proceeding_code,
               IF(l.rehab_priority_claim_yn = 'Y', 10, 20) AS min_rate_pct,
               DIV(l.outstanding_amt * IF(l.rehab_priority_claim_yn = 'Y', 10, 20), 100) AS required_min_krw,
               l.booked_provision_krw
        FROM {ds}.ont_loan_contracts l LEFT JOIN {ds}.workout_histories w USING (contract_id)
        WHERE l.asset_classification = 'SUBSTANDARD' AND l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
        ORDER BY l.contract_id
      expect:
        exact_rows: 2
        sum: {required_min_krw: 3000000000, booked_provision_krw: 4000000000}
        must_contain: [{contract_id: LN_2026_0002, min_rate_pct: 10, legal_proceeding_code: REHAB_ACT_ART180_2_DIP}, {contract_id: LN_2026_0003, min_rate_pct: 20}]
  answer: "최소 30억 원(태성금속 10억 = 회생법 제180조② 우선변제자산 10% + 극동철강 20억 = 원칙 20%). 장부 40억 원이라 10억 원 초과 적립 — 고정 분류에 대한 대손준비금 추가 적립 없음. (최소기준 '이상' 규정이므로 초과 적립 자체는 위반 아님)"
  graph_path: "(:LoanContract{asset_classification:'SUBSTANDARD'})-[:GOVERNED_BY_CRITERIA]->(:Provision{art_029})-[:HAS_EXCEPTION_PROVISO]->(:Provision{art_029_priority_claim_proviso}) ; (:LoanContract)-[:HAS_WORKOUT_HISTORY]->(:WorkoutHistory{legal_proceeding_code:'REHAB_ACT_ART180_2_DIP'})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S3

- id: CQ03
  theme: A
  cq_type: exception_path
  question: "별빛정밀도 기촉법 워크아웃 들어간 우선변제자산이잖아. 그럼 충당금도 절반만 쌓아도 되는 거지?"
  business_context: {id: RISK_MGMT}
  why_hard: "우선변제자산 감경 단서는 고정·회수의문·추정손실 목에만 붙어 있고 '요주의' 목에는 없다. 예외의 **적용 범위**를 판정해야 한다."
  trap: "우선변제자산이면 무조건 1/2 감경한다고 일반화 → 3.5억 원으로 과소 산출."
  evidence:
    - {doc: "01", page: 20, locator: "제29조제1항제1호나목", authority: binding, role: rule,
       quote: '"요주의"분류 자산의 100분의 7 이상'}
    - {doc: "01", page: 20, locator: "제29조제1항제1호라목", authority: binding, role: exception,
       quote: '"회수의문"분류 자산의 100분의 50 이상. 다만, 우선변제자산은 100분의 25 이상'}
    - {doc: "02", page: 3, locator: "별표3 2.바⑤", authority: binding, role: definition,
       quote: '「기업구조조정 촉진법」제18조제2항 및 「채무자 회생 및 파산에 관한 법률」'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, borrower_name, asset_classification, rehab_priority_claim_yn, outstanding_amt, booked_provision_krw]}
    - {table: workout_histories, source_store: bigquery, columns: [contract_id, legal_proceeding_code]}
  answer_queries:
    - sql: |
        SELECT l.contract_id, l.borrower_name, l.asset_classification, l.rehab_priority_claim_yn, w.legal_proceeding_code,
               DIV(l.outstanding_amt * 7, 100) AS required_min_krw, l.booked_provision_krw
        FROM {ds}.ont_loan_contracts l JOIN {ds}.workout_histories w USING (contract_id)
        WHERE l.contract_id = 'LN_2026_0001'
      expect:
        scalar: {asset_classification: PRECAUTIONARY, rehab_priority_claim_yn: 'Y', legal_proceeding_code: CORP_RESTRUCT_ACT_WORKOUT, required_min_krw: 700000000, booked_provision_krw: 700000000}
  answer: "아니다. 별빛정밀은 '요주의' 분류이고 제29조①1호나목(요주의 7%)에는 우선변제자산 단서가 없다. 최소 7억 원(100억 × 7%) 그대로이며 장부 7억 원과 일치. 감경은 고정(10%)·회수의문(25%)·추정손실(50%)로 떨어졌을 때만 적용."
  graph_path: "(:LoanContract{contract_id:'LN_2026_0001', asset_classification:'PRECAUTIONARY'})-[:GOVERNED_BY_CRITERIA]->(:Provision{art_029})-[:HAS_EXCEPTION_PROVISO]->(:Provision{art_029_priority_claim_proviso}) ; (:LoanContract)-[:HAS_WORKOUT_HISTORY]->(:WorkoutHistory{legal_proceeding_code:'CORP_RESTRUCT_ACT_WORKOUT'})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S3

- id: CQ04
  theme: A
  cq_type: multi_hop
  question: "우리 은행 대손충당금 적립률(coverage ratio)이 몇 %야? 국내 은행그룹들이랑 비교하면 어느 수준이야?"
  business_context: {id: RISK_MGMT}
  why_hard: "CR 정의(총대손충당금 ÷ 고정이하여신)는 연구 브리프에 있고, 분모인 '고정이하'는 감독규정 5단계 분류에서 오며, 상각 특수채권은 대차대조표 밖이라 제외해야 한다."
  trap: "연체율이나 '정상 0.85%' 같은 적립'률'(최소적립비율)과 혼동. 상각채권 85억을 분모·분자에 포함."
  evidence:
    - {doc: "01", page: 19, locator: "제27조제1항", authority: binding, role: definition,
       quote: '"정상", "요주의", "고정", "회수의문", "추정손실"의 5단계로 분류하고'}
    - {doc: "08", page: 1, locator: "KIF 금융브리프 34-05 p.8", authority: advisory, role: definition,
       quote: 'CR은 [총대손충당금 잔액/부실채권(고정이하여신)] × 100으로 계산하는데'}
    - {doc: "08", page: 2, locator: "KIF 금융브리프 34-05 p.9", authority: advisory, role: context,
       quote: '2023년 말 현재 국내 7개 은행그룹의 CR은 약 158% 수준'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [outstanding_amt, asset_classification, booked_provision_krw, account_status]}
  answer_queries:
    - sql: |
        SELECT SUM(booked_provision_krw) AS total_allowance_krw,
               SUM(IF(asset_classification IN ('SUBSTANDARD','DOUBTFUL','ESTIMATED_LOSS'), outstanding_amt, 0)) AS npl_krw,
               ROUND(100 * SUM(booked_provision_krw) /
                     SUM(IF(asset_classification IN ('SUBSTANDARD','DOUBTFUL','ESTIMATED_LOSS'), outstanding_amt, 0)), 1) AS coverage_ratio_pct
        FROM {ds}.ont_loan_contracts
        WHERE account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
      expect: {scalar: {npl_krw: 20000000000, total_allowance_krw: 15728750000, coverage_ratio_pct: 78.6}}
  answer: "78.6% (총대손충당금 157.29억 ÷ 고정이하 200억, 상각 특수채권 제외). KIF 브리프 기준 국내 7개 은행그룹 158%(2023말), 시중은행그룹 132.2%(2024.3Q) 대비 크게 낮다 — 정상여신 0.85% 적립이 대부분이고 고정이하 2건이 20%대 적립에 그치기 때문. (연구 브리프는 advisory: 비교 참고치이며 규제 기준 아님)"
  graph_path: "(:BusinessContext{context_id:'RISK_MGMT'})-[:INVOKES_PROVISION{term_key:'provision-criteria'}]->(:Provision)-[:PART_OF_DOCUMENT]->(:SourceDocument{doc_id:'DOC_08_KIF_PROVISION'}) ; (:BusinessContext{context_id:'RISK_MGMT'})-[:SCOPES_PORTFOLIO]->(:LoanContract)-[:GOVERNED_BY_CRITERIA]->(:Provision{art_027})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

# ============================================================================
# B. 부서별 연체율 정의 분기
# ============================================================================
- id: CQ05
  theme: B
  cq_type: context_branch
  question: "다음 주 리스크관리위원회에 올릴 기업여신 부실(고정이하) 비율 뽑아줘."
  business_context: {id: RISK_MGMT}
  why_hard: "'연체율' 계열 지표 중 리스크위원회 보고용은 연체일수가 아니라 **건전성 분류**(고정·회수의문·추정손실) 기준이다. 채권재조정 특례로 요주의가 된 45일 연체 건과 상각 특수채권은 빠져야 한다."
  trap: "30일/90일 연체 기준으로 계산하거나, 상각 특수채권 85억을 포함."
  evidence:
    - {doc: "10", page: 1, locator: "내규 제14조①", authority: internal, role: definition,
       quote: '리스크관리위원회 보고용 고정이하여신비율(은행업감독규정 제27조 및 별표3에 따른 3월 이상 연체 등'}
    - {doc: "01", page: 19, locator: "제27조제1항", authority: binding, role: rule,
       quote: '"정상", "요주의", "고정", "회수의문", "추정손실"의 5단계로 분류하고'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [outstanding_amt, asset_classification, account_status]}
  answer_queries:
    - sql: |
        SELECT SUM(IF(asset_classification IN ('SUBSTANDARD','DOUBTFUL','ESTIMATED_LOSS'), outstanding_amt, 0)) AS npl_krw,
               SUM(outstanding_amt) AS on_bs_total_krw,
               ROUND(100 * SUM(IF(asset_classification IN ('SUBSTANDARD','DOUBTFUL','ESTIMATED_LOSS'), outstanding_amt, 0)) / SUM(outstanding_amt), 2) AS npl_ratio_pct
        FROM {ds}.ont_loan_contracts WHERE account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
      expect: {scalar: {npl_krw: 20000000000, on_bs_total_krw: 1327500000000, npl_ratio_pct: 1.51}}
  answer: "1.51% (고정이하 200억 ÷ 대차대조표 기업여신 1조 3,275억). 별빛정밀 100억(45일 연체·요주의)과 상각 특수채권 85억은 제외."
  graph_path: "(:BusinessContext{context_id:'RISK_MGMT'})-[:INVOKES_PROVISION{term_key:'delinquency-rate'}]->(:Provision{art_027})-[:DELEGATES_TO_INTERNAL]->(:Provision{internal_art_14_ews_delinquency}) ; (:BusinessContext{context_id:'RISK_MGMT'})-[:SCOPES_PORTFOLIO]->(:LoanContract)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S1

- id: CQ06
  theme: B
  cq_type: context_branch
  question: "금감원 공시에 들어갈 원화대출 연체율은 얼마로 나가? 리스크위원회 숫자랑 왜 달라?"
  business_context: {id: DISCLOSURE}
  why_hard: "공시용은 '1월 이상 원리금 연체' + '대손상각 특수채권 제외' 기준. 국회입법조사처 브리프의 '가계대출 연체율 0.24%' 같은 외부 수치를 섞으면 안 된다."
  trap: "가계대출 연체율(0.24%)이나 저축은행 2개월 기준을 인용. 건전성 분류 기준(1.51%)을 그대로 보고."
  evidence:
    - {doc: "10", page: 1, locator: "내규 제14조①", authority: internal, role: definition,
       quote: '금융감독원 대외공시용 원화대출 연체율(1월 이상 원리금 연체 기준, 대손상각 특수채권 제외)'}
    - {doc: "02", page: 7, locator: "별표3 7.나 연체기간 기산", authority: binding, role: definition,
       quote: '연체기간은 이자 또는 원금(분할상환금 포함)을 상환하기로 한 약정기일의 다음날'}
    - {doc: "07", page: 2, locator: "NARS 제2071호 (3) 연체율", authority: advisory, role: distractor,
       quote: '기준 0.24%로 전년 동월말(0.16%) 대비 0.08%p'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, outstanding_amt, account_status]}
    - {table: ont_delinquency_events, source_store: spanner, columns: [contract_id, overdue_days, write_off_yn]}
  answer_queries:
    - sql: |
        WITH d AS (SELECT contract_id, MAX(overdue_days) AS od FROM {ds}.ont_delinquency_events WHERE write_off_yn = 'N' GROUP BY contract_id)
        SELECT SUM(IF(d.od >= 30, l.outstanding_amt, 0)) AS delinquent_1m_krw,
               SUM(l.outstanding_amt) AS on_bs_total_krw,
               ROUND(100 * SUM(IF(d.od >= 30, l.outstanding_amt, 0)) / SUM(l.outstanding_amt), 2) AS official_delinquency_pct
        FROM {ds}.ont_loan_contracts l LEFT JOIN d USING (contract_id)
        WHERE l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
      expect: {scalar: {delinquent_1m_krw: 30000000000, official_delinquency_pct: 2.26}}
  answer: "2.26% (1개월 이상 연체 300억 ÷ 1조 3,275억). 리스크위원회 1.51% 와의 차이는 별빛정밀 100억 — 45일 연체라 공시 연체율에는 들어가지만, 별표3 라목 특례로 '요주의' 분류라 고정이하 비율에서는 빠진다. 가계대출 0.24%(NARS)는 타 여신유형 수치로 무관."
  graph_path: "(:BusinessContext{context_id:'DISCLOSURE'})-[:INVOKES_PROVISION{term_key:'delinquency-rate'}]->(:Provision{internal_art_14_ews_delinquency})-[:CONFLICTS_BY_SECTOR]->(:Provision{nars_02_dsr})-[:PART_OF_DOCUMENT]->(:SourceDocument{doc_id:'DOC_07_NARS_RATE'}) ; (:BusinessContext{context_id:'DISCLOSURE'})-[:SCOPES_PORTFOLIO]->(:LoanContract)-[:HAS_DELINQUENCY]->(:DelinquencyEvent{write_off_yn:'N'})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S1

- id: CQ07
  theme: B
  cq_type: context_branch
  question: "여신관리팀 조기경보 기준으로 실질 연체율 몇 %야? 공시 수치보다 왜 이렇게 높아?"
  business_context: {id: CREDIT_MGMT}
  why_hard: "EWS 실질관리 연체율은 당행 내규에만 정의돼 있고, 10일 이상 연체 + 상각 특수채권을 분자·분모 **모두**에 넣는다. 공시 기준과 정반대로 특수채권을 포함."
  trap: "공시 기준(30일, 특수채권 제외)으로 계산하거나, 분자에만 특수채권을 넣고 분모에는 빠뜨림."
  evidence:
    - {doc: "10", page: 1, locator: "내규 제14조②1호", authority: internal, role: rule,
       quote: '1. 분자: 10일 이상 원리금 연체 기업여신 잔액 + 30일 이상 관리연체 잔액 + 회계상 대손상각 처리되어 특수'}
    - {doc: "10", page: 1, locator: "내규 제14조②2호", authority: internal, role: rule,
       quote: '2. 분모: 대차대조표상 원화 기업여신 총잔액 + 대손상각 특수채권 미회수 원금 잔액'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, outstanding_amt, account_status]}
    - {table: ont_delinquency_events, source_store: spanner, columns: [contract_id, overdue_days, overdue_principal_krw, write_off_yn]}
  answer_queries:
    - sql: |
        WITH d AS (SELECT contract_id, MAX(overdue_days) AS od FROM {ds}.ont_delinquency_events WHERE write_off_yn = 'N' GROUP BY contract_id),
             wo AS (SELECT SUM(overdue_principal_krw) AS wo_principal FROM {ds}.ont_delinquency_events WHERE write_off_yn = 'Y')
        SELECT SUM(IF(d.od >= 10, l.outstanding_amt, 0)) AS ews_10d_krw, ANY_VALUE(wo.wo_principal) AS written_off_principal_krw,
               SUM(l.outstanding_amt) AS on_bs_total_krw,
               ROUND(100 * (SUM(IF(d.od >= 10, l.outstanding_amt, 0)) + ANY_VALUE(wo.wo_principal)) / (SUM(l.outstanding_amt) + ANY_VALUE(wo.wo_principal)), 2) AS ews_ratio_pct
        FROM {ds}.ont_loan_contracts l LEFT JOIN d USING (contract_id) CROSS JOIN wo
        WHERE l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
      expect: {scalar: {ews_10d_krw: 45000000000, written_off_principal_krw: 8500000000, ews_ratio_pct: 4.0}}
  answer: "4.00% ((10일 이상 연체 450억 + 상각 특수채권 85억) ÷ (1조 3,275억 + 85억)). 공시 2.26% 대비 차이는 18일 연체 3건(150억)과 특수채권 85억. ※ 내규 산식의 '30일 이상 관리연체 잔액'은 10일 이상 집합의 부분집합이므로 중복 가산하지 않는 해석을 채택(해석 주석)."
  graph_path: "(:BusinessContext{context_id:'CREDIT_MGMT'})-[:INVOKES_PROVISION{term_key:'delinquency-rate'}]->(:Provision{internal_art_14_ews_delinquency}) ; (:BusinessContext{context_id:'CREDIT_MGMT'})-[:SCOPES_PORTFOLIO]->(:LoanContract)-[:HAS_DELINQUENCY]->(:DelinquencyEvent)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S1

# ============================================================================
# C. 예외 · 특례
# ============================================================================
- id: CQ08
  theme: C
  cq_type: exception_path
  question: "별빛정밀 채권재조정 중인데 고정이하로 안 떨어뜨리고 요주의로 둔 근거가 뭐야? 감사 때 문제 없을까?"
  business_context: {id: CREDIT_REVIEW}
  why_hard: "별표3 3.라목의 두 요건(①6개월 이상 연속 이행 ②증자 등 상환능력 개선 사건) 중 하나 + '판단근거 문서화' 단서를 원장·워크아웃 이력·예외승인 기록과 각각 대조해야 한다."
  trap: "채권재조정여신 = 고정이하 로 일반화하거나, 문서화 의무(단서)를 누락."
  evidence:
    - {doc: "02", page: 4, locator: "별표3 3.라목 본문·단서", authority: binding, role: exception,
       quote: '고정이하로 분류하지 아니할 수 있다. 다만, 판단근거를 명확히 문서화하여야 한다.'}
    - {doc: "02", page: 4, locator: "별표3 3.라목①", authority: binding, role: condition,
       quote: '거래기업이 6개월 이상(채권재조정을 위한 절차가 개시되어 채권재조정의 조건'}
    - {doc: "02", page: 5, locator: "별표3 3.라목②", authority: binding, role: condition,
       quote: '증자(출자전환을 포함한다) 등과 같이 채무상환능력을 명확히 개선시키는 사건이 발생한 경우'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, asset_classification, overdue_days]}
    - {table: workout_histories, source_store: bigquery, columns: [contract_id, consecutive_normal_repay_months, new_equity_paid_in_krw]}
    - {table: ont_exception_approvals, source_store: spanner, columns: [contract_id, approval_type_code, approval_status, approver_role_code, approval_dt]}
  answer_queries:
    - sql: |
        SELECT l.contract_id, l.asset_classification, l.overdue_days, w.consecutive_normal_repay_months, w.new_equity_paid_in_krw,
               (w.consecutive_normal_repay_months >= 6) AS cond1_6m_repay, (w.new_equity_paid_in_krw > 0) AS cond2_equity,
               a.approval_type_code, a.approval_status, a.approver_role_code, CAST(a.approval_dt AS STRING) AS approval_dt
        FROM {ds}.ont_loan_contracts l
        JOIN {ds}.workout_histories w USING (contract_id)
        LEFT JOIN {ds}.ont_exception_approvals a USING (contract_id)
        WHERE l.contract_id = 'LN_2026_0001'
      expect:
        scalar: {asset_classification: PRECAUTIONARY, cond1_6m_repay: true, cond2_equity: true, approval_status: APPROVED, approval_dt: '2026-02-25'}
  answer: "근거: 별표3 3.라목 — ① 7개월 연속 정상 이행(≥6개월), ② 유상증자 50억 원 납입, 두 요건 모두 충족. 단서의 '판단근거 문서화'는 2026-02-25 본부 여신심사역(HQ_SENIOR_CREDIT_OFFICER) EOD 유예 승인 기록으로 확인. 45일 연체 자체는 별표3 1.나② 상 요주의 구간이라 분류 결과와도 일치."
  graph_path: "(:Customer{customer_id:'CUST_0001'})<-[:BORROWED_BY]-(:LoanContract{contract_id:'LN_2026_0001'})-[:GOVERNED_BY_CRITERIA]->(:Provision{annex3_item_03_ra_restructured_exemption}) ; (:LoanContract)-[:HAS_WORKOUT_HISTORY]->(:WorkoutHistory) ; (:LoanContract)-[:HAS_EXCEPTION_APPROVAL]->(:ExceptionApproval{approval_status:'APPROVED'})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S3

- id: CQ09
  theme: C
  cq_type: multi_hop
  question: "연체 30일 넘은 기업여신 중에 기한이익상실(EOD) 바로 처리해야 하는 차주랑 유예할 수 있는 차주 나눠줘. 지금 결재 결과가 내규랑 맞아?"
  business_context: {id: CREDIT_MGMT}
  why_hard: "내규 제16조(30일 초과 → EOD 예정 통지)에 제18조 유예 특례가 겹친다. 유예는 '각 호의 요건'(①6개월 이행·증자·신보 85%+ 보증 중 하나 AND ②우선변제자산) + 본부 여신심사역 승인이 모두 필요."
  trap: "회생법 우선변제자산이면 무조건 유예(태성금속 오판), 또는 보증비율 70% 를 요건 충족으로 봄."
  evidence:
    - {doc: "10", page: 1, locator: "내규 제16조①", authority: internal, role: rule,
       quote: '원리금 연체가 1월(30일)을 초과하는 경우 여신관리시스템은 기한이익상실(EOD) 예정'}
    - {doc: "10", page: 1, locator: "내규 제18조 본문", authority: internal, role: exception,
       quote: '본부 여신심사역의 승인(APPROVED)을 득한 경우에는 고정이하'}
    - {doc: "10", page: 1, locator: "내규 제18조1호", authority: internal, role: condition,
       quote: '신용보증기금(KODIT) 85% 이상 보증서 담보 제공'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, borrower_name, overdue_days, rehab_priority_claim_yn, account_status]}
    - {table: workout_histories, source_store: bigquery, columns: [contract_id, consecutive_normal_repay_months, new_equity_paid_in_krw]}
    - {table: ont_collaterals, source_store: spanner, columns: [contract_id, guarantee_agency_code, guarantee_ratio_pct]}
    - {table: ont_exception_approvals, source_store: spanner, columns: [contract_id, approval_status]}
  answer_queries:
    - sql: |
        SELECT l.contract_id, l.borrower_name, l.overdue_days,
               ((IFNULL(w.consecutive_normal_repay_months, 0) >= 6 OR IFNULL(w.new_equity_paid_in_krw, 0) > 0
                 OR (c.guarantee_agency_code = 'KODIT' AND c.guarantee_ratio_pct >= 85))
                AND l.rehab_priority_claim_yn = 'Y') AS art18_eligible,
               IFNULL(a.approval_status, 'NONE') AS approval_status,
               IF(a.approval_status = 'APPROVED', 'EOD_DEFERRED', 'EOD_NOTICE') AS eod_action
        FROM {ds}.ont_loan_contracts l
        LEFT JOIN {ds}.workout_histories w USING (contract_id)
        LEFT JOIN {ds}.ont_collaterals c USING (contract_id)
        LEFT JOIN {ds}.ont_exception_approvals a USING (contract_id)
        WHERE l.overdue_days > 30 AND l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
        ORDER BY l.contract_id
      expect:
        exact_rows: 3
        must_contain:
          - {contract_id: LN_2026_0001, art18_eligible: true, eod_action: EOD_DEFERRED}
          - {contract_id: LN_2026_0002, art18_eligible: false, eod_action: EOD_NOTICE}
          - {contract_id: LN_2026_0003, art18_eligible: false, eod_action: EOD_NOTICE}
  answer: "30일 초과 3건. 유예: 별빛정밀(요건 ①·② 충족 + 승인). EOD 통지: 태성금속(②우선변제자산은 충족하나 ①불충족 — 2개월 이행·증자 0·신보 보증 70% < 85%), 극동철강(①②모두 불충족). 결재 결과 3건 모두 내규와 일치. ※ '각 호의 요건을 충족'을 AND 로 해석(해석 주석)."
  graph_path: "(:BusinessContext{context_id:'CREDIT_MGMT'})-[:INVOKES_PROVISION{term_key:'eod-deferral'}]->(:Provision{internal_art_16_eod_notice_rule})-[:HAS_EXCEPTION_PROVISO]->(:Provision{internal_art_18_workout_kodit_waiver}) ; (:LoanContract)-[:HAS_WORKOUT_HISTORY]->(:WorkoutHistory) ; (:LoanContract)-[:HAS_COLLATERAL]->(:Collateral) ; (:LoanContract)-[:HAS_EXCEPTION_APPROVAL]->(:ExceptionApproval)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

- id: CQ10
  theme: C
  cq_type: lookup
  question: "담보 잡혀 있는 여신 중에 EOD 유예 요건(보증서 기준)을 채우는 건 어느 거야?"
  business_context: {id: CREDIT_REVIEW}
  why_hard: "내규 제18조 요건은 '신용보증기금(KODIT) 85% 이상 **보증서**'. 부동산 담보(신탁 1순위)나 70% 보증서는 해당하지 않는다. 담보 유형·기관·비율 세 컬럼을 동시에 판정."
  trap: "담보가 있으면 충족, 또는 담보가액 비율만 보고 판단."
  evidence:
    - {doc: "10", page: 1, locator: "내규 제18조1호", authority: internal, role: condition,
       quote: '신용보증기금(KODIT) 85% 이상 보증서 담보 제공'}
    - {doc: "02", page: 3, locator: "별표3 2.바①", authority: binding, role: rule,
       quote: '보증부 여신은 거래기업 뿐만 아니라 보증인의 채무상환능력을 평가하여 건전성'}
  data_fields:
    - {table: ont_collaterals, source_store: spanner, columns: [contract_id, collateral_type_code, guarantee_agency_code, guarantee_ratio_pct, appraised_collateral_krw]}
  answer_queries:
    - sql: |
        SELECT contract_id, collateral_type_code, guarantee_agency_code, guarantee_ratio_pct, appraised_collateral_krw,
               (collateral_type_code = 'CREDIT_GUARANTEE_CERT' AND guarantee_agency_code = 'KODIT' AND guarantee_ratio_pct >= 85) AS meets_art18_guarantee
        FROM {ds}.ont_collaterals ORDER BY contract_id
      expect:
        exact_rows: 3
        must_contain:
          - {contract_id: LN_2026_0001, meets_art18_guarantee: true}
          - {contract_id: LN_2026_0002, meets_art18_guarantee: false}
          - {contract_id: LN_2026_KSIC_L1, meets_art18_guarantee: false}
  answer: "1건 — 별빛정밀(신보 보증서 90%). 태성금속은 신보 보증서지만 70% 로 미달, 대양피에프개발은 부동산 담보(신탁 1순위 60%)라 보증서 요건과 무관. 별표3 2.바①에 따라 보증부 여신은 보증인 능력 반영 분류가 '가능'(재량)하다는 점은 별개."
  graph_path: "(:BusinessContext{context_id:'CREDIT_REVIEW'})-[:INVOKES_PROVISION{term_key:'eod-deferral'}]->(:Provision{internal_art_18_workout_kodit_waiver})<-[:GOVERNED_BY_CRITERIA]-(:LoanContract)-[:HAS_COLLATERAL]->(:Collateral{guarantee_agency_code:'KODIT'})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

- id: CQ11
  theme: C
  cq_type: context_branch
  question: "상각 처리한 성진해운물류 건은 규정대로 처리된 거야? 그리고 연체율 지표들엔 이게 들어가, 빠져?"
  business_context: {id: COMPLIANCE}
  why_hard: "부실자산 조기상각 의무(제27조④)와, 상각 특수채권을 공시 연체율은 **제외**·EWS 는 **포함**하는 내규 제14조의 상반된 취급을 한 번에 답해야 한다."
  trap: "상각 = 장부에서 완전 소멸 → 모든 지표에서 제외, 또는 모든 지표에 포함."
  evidence:
    - {doc: "01", page: 19, locator: "제27조제4항", authority: binding, role: rule,
       quote: '"회수의문" 또는 "추정손실"로 분류된 자산(이하 "부실자산"이라 한다)을 조기에'}
    - {doc: "10", page: 1, locator: "내규 제14조①", authority: internal, role: exception,
       quote: '금융감독원 대외공시용 원화대출 연체율(1월 이상 원리금 연체 기준, 대손상각 특수채권 제외)'}
    - {doc: "10", page: 1, locator: "내규 제14조②2호", authority: internal, role: exception,
       quote: '2. 분모: 대차대조표상 원화 기업여신 총잔액 + 대손상각 특수채권 미회수 원금 잔액'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, borrower_name, asset_classification, account_status, outstanding_amt, booked_provision_krw]}
    - {table: ont_delinquency_events, source_store: spanner, columns: [contract_id, overdue_days, write_off_yn]}
    - {table: customers, source_store: bigquery, columns: [customer_id, ksic_section_code, credit_rating]}
  answer_queries:
    - sql: |
        SELECT l.contract_id, l.borrower_name, c.ksic_section_code, c.credit_rating, l.asset_classification, l.account_status,
               d.overdue_days, d.write_off_yn, l.outstanding_amt, l.booked_provision_krw
        FROM {ds}.ont_loan_contracts l JOIN {ds}.ont_delinquency_events d USING (contract_id)
        JOIN {ds}.customers c ON c.customer_id = l.customer_id
        WHERE d.write_off_yn = 'Y'
      expect:
        exact_rows: 1
        must_contain: [{contract_id: LN_2025_WRITEOFF_01, asset_classification: ESTIMATED_LOSS, account_status: WRITTEN_OFF_SPECIAL_CLAIM, overdue_days: 210, booked_provision_krw: 8500000000}]
  answer: "규정 부합: 210일 연체 '추정손실' → 제27조④ 부실자산 조기상각 원칙대로 상각(특수채권 편입), 충당금 100%(85억). 지표 취급: 리스크 고정이하비율·공시 연체율 = 제외(대차대조표 밖·내규 제14조①), 여신관리팀 EWS = 분자·분모 모두 포함(내규 제14조②). ※ KSIC I(운수업)이라 F·G·H·L 단서와 무관."
  graph_path: "(:LoanContract{account_status:'WRITTEN_OFF_SPECIAL_CLAIM'})-[:GOVERNED_BY_CRITERIA]->(:Provision{art_027})-[:DELEGATES_TO_INTERNAL]->(:Provision{internal_art_14_ews_delinquency}) ; (:LoanContract)-[:HAS_DELINQUENCY]->(:DelinquencyEvent{write_off_yn:'Y'}) ; (:LoanContract)-[:BORROWED_BY]->(:Customer)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

