- id: CQ20
  theme: F
  cq_type: impact
  question: "별빛정밀이 다음 달 상환을 한 번 못 하면 어떻게 돼? 충당금이 얼마나 늘어?"
  business_context: {id: RISK_MGMT}
  why_hard: "상환 누락 → 별표3 라목 특례 근거 중 ①(연속 이행)이 깨지지만 ②(증자) 근거는 남는다. 특례가 철회돼 '고정'이 되더라도 우선변제자산 10% 가 적용된다. 조건 변경의 영향을 규정 연결을 따라 역추적해야 한다."
  trap: "즉시 고정 20%(+13억)로 계산하거나, 증자 근거가 남는다는 점을 놓침."
  evidence:
    - {doc: "02", page: 4, locator: "별표3 3.라목①", authority: binding, role: condition,
       quote: '거래기업이 6개월 이상(채권재조정을 위한 절차가 개시되어 채권재조정의 조건'}
    - {doc: "02", page: 5, locator: "별표3 3.라목②", authority: binding, role: condition,
       quote: '증자(출자전환을 포함한다) 등과 같이 채무상환능력을 명확히 개선시키는 사건이 발생한 경우'}
    - {doc: "01", page: 20, locator: "제29조제1항제1호다목 단서", authority: binding, role: exception,
       quote: '제180조제2항에 따라 은행이 우선하여 변제받을 권리가 인정되는 자산(이하 "우선변제자산"이라 한다)은 100분의 10 이상'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, outstanding_amt, booked_provision_krw, rehab_priority_claim_yn]}
    - {table: workout_histories, source_store: bigquery, columns: [contract_id, consecutive_normal_repay_months, new_equity_paid_in_krw]}
  answer_queries:
    - sql: |
        SELECT l.contract_id, w.consecutive_normal_repay_months, w.new_equity_paid_in_krw,
               (w.new_equity_paid_in_krw > 0) AS cond2_survives,
               l.booked_provision_krw AS current_booked_krw,
               DIV(l.outstanding_amt * IF(l.rehab_priority_claim_yn = 'Y', 10, 20), 100) AS if_substandard_min_krw,
               DIV(l.outstanding_amt * IF(l.rehab_priority_claim_yn = 'Y', 10, 20), 100) - l.booked_provision_krw AS delta_krw,
               DIV(l.outstanding_amt * 20, 100) - l.booked_provision_krw AS naive_delta_krw
        FROM {ds}.ont_loan_contracts l JOIN {ds}.workout_histories w USING (contract_id)
        WHERE l.contract_id = 'LN_2026_0001'
      expect: {scalar: {cond2_survives: true, current_booked_krw: 700000000, if_substandard_min_krw: 1000000000, delta_krw: 300000000, naive_delta_krw: 1300000000}}
  answer: "연속 이행 요건(①)은 깨지지만 유상증자 50억(②)이 남아 라목 특례 유지가 규정상 가능 → 문서화 갱신 시 요주의 7억 유지. 특례를 철회해 '고정'으로 가더라도 우선변제자산 10% 적용 → 최소 10억, 즉 +3억 원(원칙 20% 로 오산하면 +13억)."
  graph_path: "(:LoanContract{contract_id:'LN_2026_0001'})-[:HAS_WORKOUT_HISTORY]->(:WorkoutHistory) ; (:LoanContract)-[:GOVERNED_BY_CRITERIA]->(:Provision{annex3_item_03_ra_restructured_exemption}) ; (:LoanContract)-[:GOVERNED_BY_CRITERIA]->(:Provision{art_029})-[:HAS_EXCEPTION_PROVISO]->(:Provision{art_029_priority_claim_proviso})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S3
