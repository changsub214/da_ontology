- id: CQ12
  theme: D
  cq_type: exception_path
  question: "에이펙스세미콘이 특허 땄다고 금리인하요구 했는데 우리가 거절했잖아. 고객이 '특허 취득은 금리인하 사유로 정해져 있다'고 항의하는데, 거절이 맞아? 뭐라고 통보해야 해?"
  business_context: {id: BRANCH}
  why_hard: "금융당국 개선방안 표에는 '특허권 등의 신규취득'이 기업대출 인하 사유로 나열돼 있지만, 같은 쪽 ④항 단서로 은행 선택 적용이 가능하고, 당행 내규 제25조②가 그 재량을 '단독 특허 제외'로 행사했다. 또한 거절 시 구체적 사유 통보 의무가 있다."
  trap: "표의 사유 목록만 읽고 '인하 의무' 로 답함. 통보 의무 누락."
  evidence:
    - {doc: "05", page: 4, locator: "Ⅱ-1-나 기업대출 사유 표", authority: advisory, role: distractor,
       quote: '특허권 등의 신규취득'}
    - {doc: "05", page: 4, locator: "Ⅱ-1-나 ④", authority: advisory, role: exception,
       quote: '특허 취득 등은 은행이 선택적으로 적용할 수 있도록 조정'}
    - {doc: "05", page: 4, locator: "Ⅱ-1-나 ②", authority: advisory, role: rule,
       quote: '금리인하요구 처리결과는 반드시 통보토록 하고 통보시에는'}
    - {doc: "10", page: 2, locator: "내규 제25조②", authority: internal, role: rule,
       quote: '단독 취득만으로는 즉각적인 현금흐름 개선이 입증되지 않는 것으로 보아 필수 금리인하 사유에서 제외'}
  data_fields:
    - {table: ont_rate_cut_requests, source_store: spanner, columns: [request_id, customer_id, application_reason_code, credit_rating_before, credit_rating_after, yoy_revenue_growth_pct, review_status_code, approved_cut_bp]}
    - {table: customers, source_store: bigquery, columns: [customer_id, borrower_name]}
  answer_queries:
    - sql: |
        SELECT r.request_id, c.borrower_name, r.application_reason_code, r.credit_rating_before, r.credit_rating_after,
               r.yoy_revenue_growth_pct, (r.credit_rating_after != r.credit_rating_before) AS rating_upgraded,
               r.review_status_code, r.approved_cut_bp
        FROM {ds}.ont_rate_cut_requests r JOIN {ds}.customers c USING (customer_id)
        ORDER BY r.request_id
      expect:
        exact_rows: 2
        must_contain:
          - {borrower_name: '에이펙스세미콘(주)', rating_upgraded: false, review_status_code: REJECTED, approved_cut_bp: 0}
          - {borrower_name: '네오바이오텍(주)', rating_upgraded: true, review_status_code: APPROVED, approved_cut_bp: 35}
  answer: "거절 적법. 개선방안 ④항이 특허 취득을 은행 선택 적용 사유로 조정했고, 당행 내규 제25조②는 단독 특허를 필수 인하 사유에서 제외(재무 개선·신용등급 상승 동반 시에만 인하). 에이펙스세미콘은 등급 BBB→BBB 불변·매출 +1.2% 로 동반 요건 미충족. 같은 날 특허+등급 상승(BBB→BBB+)한 네오바이오텍은 35bp 인하 승인 — 일관됨. 통보: 개선방안 ②에 따라 처리결과와 '구체적 사유'(단독 특허, 신용등급·재무상태 개선 미확인)를 반드시 통보."
  graph_path: "(:Customer{customer_id:'CUST_0008'})<-[:BORROWED_BY]-(:LoanContract)-[:HAS_RATE_CUT_REQUEST]->(:RateCutRequest)-[:EVALUATED_UNDER_PROVISION]->(:Provision{rate_reform_sec_2_1_b_patent_discretion})-[:DELEGATES_TO_INTERNAL]->(:Provision{internal_art_25_tcb_and_patent_exclusion})"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S5

- id: CQ13
  theme: D
  cq_type: absence
  question: "TCB 기술혁신 운전자금 계약 중에 영업점장 전결 한도를 넘겨서 우대금리를 준 건이나, 부채비율 기준 넘는 차주 있어?"
  business_context: {id: COMPLIANCE}
  why_hard: "전결 상한(1.20%p)·부채비율 상한(250%)은 법정 기준이 아니라 당행 내규에만 있다. 정답은 '위반 0건'이며, 상한에 딱 걸린 계약(경계값)을 구분해서 말해야 한다."
  trap: "법정 의무처럼 서술하거나, 상한 = 위반으로 오판(>= vs >)."
  evidence:
    - {doc: "10", page: 2, locator: "내규 제25조①", authority: internal, role: rule,
       quote: '대금리(pref_rate) 한도는 연 1.20%p, 신속심사 승인 부채비율 상한은 250.0%로 한다'}
    - {doc: "10", page: 2, locator: "내규 제25조① 괄호", authority: internal, role: context,
       quote: '법정 의무사항이 아닌 별빛은행 자체 내부 가이드라인이다'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, customer_id, product_code, pref_rate]}
    - {table: customers, source_store: bigquery, columns: [customer_id, debt_ratio_pct]}
  answer_queries:
    - sql: |
        SELECT l.contract_id, l.pref_rate, c.debt_ratio_pct
        FROM {ds}.ont_loan_contracts l JOIN {ds}.customers c USING (customer_id)
        WHERE l.product_code = 'PROD_TCB_WORKING' AND (l.pref_rate > 1.20 OR c.debt_ratio_pct > 250.0)
      expect: {exact_rows: 0}
    - sql: |
        SELECT l.contract_id, l.pref_rate, c.debt_ratio_pct
        FROM {ds}.ont_loan_contracts l JOIN {ds}.customers c USING (customer_id)
        WHERE l.product_code = 'PROD_TCB_WORKING' AND l.pref_rate >= 1.20
        ORDER BY l.contract_id
      expect:
        exact_rows: 2
        must_contain: [{contract_id: LN_2026_0213_01}, {contract_id: LN_2026_0213_05}]
  answer: "위반 0건. TCB 5건 모두 우대금리 ≤ 1.20%p·부채비율 ≤ 250%. 단 LN_2026_0213_01·_05 두 건은 우대금리가 정확히 상한(1.20%p)이라 추가 우대 여지 없음. 이 기준은 금융당국 법정 기준이 아니라 당행 내부 가이드라인(내규 제25조① 괄호)."
  graph_path: "(:BusinessContext{context_id:'COMPLIANCE'})-[:INVOKES_PROVISION{term_key:'loan-rate'}]->(:Provision{internal_art_25_tcb_and_patent_exclusion})<-[:GOVERNED_BY_CRITERIA]-(:LoanContract)-[:OF_PRODUCT]->(:FinancialProduct{product_code:'PROD_TCB_WORKING'}) ; (:LoanContract)-[:BORROWED_BY]->(:Customer)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

- id: CQ14
  theme: D
  cq_type: lookup
  question: "2월 13일에 나간 대출들 평균 금리가 얼마였고, 제일 많이 팔린 상품은 뭐야?"
  business_context: {id: BRANCH}
  why_hard: "'나간 대출'의 기준일(등록·체결·실행) 중 내규는 특정일자 조회 시 **체결일**을 필수 기준으로 정한다. '평균 금리'는 우대 차감 후 적용금리, '제일 많이'는 건수와 금액 1위가 다르다."
  trap: "reg_dt/disburse_dt 로 조회(0건), base_rate 평균 보고, 건수·금액 1위 혼동. (Text-to-SQL 성격이 강함 — GraphRAG 고유 강점 아님)"
  evidence:
    - {doc: "10", page: 2, locator: "내규 제21조①2호", authority: internal, role: definition,
       quote: '"특정일자 체결 대출" 조회 시 필수 기준 컬럼'}
    - {doc: "10", page: 2, locator: "내규 제22조①", authority: internal, role: definition,
       quote: '최종 적용금리(applied_rate) = 기준금리(base_rate) + 가산금리(spread_rate) + 가감조정금리(△우대금리'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, product_code, reg_dt, contract_dt, disburse_dt, applied_rate, contract_amt]}
    - {table: financial_products, source_store: bigquery, columns: [product_code, product_name]}
  answer_queries:
    - sql: |
        SELECT p.product_name, COUNT(*) AS contracts, SUM(l.contract_amt) AS amount_krw, ROUND(AVG(l.applied_rate), 2) AS avg_applied_rate
        FROM {ds}.ont_loan_contracts l JOIN {ds}.financial_products p USING (product_code)
        WHERE l.contract_dt = DATE '2026-02-13'
        GROUP BY p.product_name ORDER BY contracts DESC
      expect:
        exact_rows: 2
        must_contain:
          - {product_name: '별빛 TCB 기술혁신 운전자금', contracts: 5, amount_krw: 4500000000}
          - {product_name: '별빛 프라임 중견기업 운전자금', contracts: 3, amount_krw: 9000000000}
    - sql: |
        SELECT COUNT(*) AS contracts, ROUND(AVG(applied_rate), 2) AS avg_applied_rate,
               (SELECT COUNT(*) FROM {ds}.ont_loan_contracts WHERE reg_dt = DATE '2026-02-13' OR disburse_dt = DATE '2026-02-13') AS wrong_date_column_hits
        FROM {ds}.ont_loan_contracts WHERE contract_dt = DATE '2026-02-13'
      expect: {scalar: {contracts: 8, avg_applied_rate: 4.82, wrong_date_column_hits: 0}}
  answer: "체결일 기준 8건, 평균 적용금리 4.82%. 건수 1위 = 별빛 TCB 기술혁신 운전자금(5건·45억), 금액 1위 = 별빛 프라임 중견기업 운전자금(3건·90억). 등록일·실행일로 조회하면 0건."
  graph_path: "(:BusinessContext{context_id:'BRANCH'})-[:INVOKES_PROVISION{term_key:'base-date'}]->(:Provision{internal_art_21_three_dates})<-[:GOVERNED_BY_CRITERIA]-(:LoanContract{contract_dt:'2026-02-13'})-[:OF_PRODUCT]->(:FinancialProduct)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: S4

- id: CQ15
  theme: D
  cq_type: multi_hop
  question: "은행연합회 비교공시용으로 우리 상품별 대출금리 구성을 정리해줘. 가산금리가 경쟁사보다 낮아 보이게 할 방법도 있어?"
  business_context: {id: COMPLIANCE}
  why_hard: "개선방안·내규 모두 A(기준)+B(가산)+C(가감조정)를 **분리** 공시하도록 요구하고, B 에 C 를 합산해 가산금리를 낮아 보이게 하는 것은 금지된 착시. 질문 후반부는 금지 행위를 유도한다."
  trap: "spread − pref 를 '가산금리'로 보고하거나, 착시 방법을 제안."
  evidence:
    - {doc: "05", page: 3, locator: "Ⅱ-1-가 산정체계", authority: advisory, role: definition,
       quote: '대출금리 = 기준금리 + 가산금리 + 가감조정금리(우대금리+전결금리)'}
    - {doc: "10", page: 2, locator: "내규 제22조②", authority: internal, role: rule,
       quote: '반드시 기준금리(A), 가산금리(B), 가감조정금리(C)를 각각 분리하여 공시'}
    - {doc: "06", page: 2, locator: "제7차 TF 정비방향", authority: advisory, role: context,
       quote: '우대금리를 시계열적으로 비교·분석할 수 있도록 공시항목을 세분화하는'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [product_code, base_rate, spread_rate, pref_rate, applied_rate]}
    - {table: financial_products, source_store: bigquery, columns: [product_code, product_name, base_rate_benchmark]}
  answer_queries:
    - sql: |
        SELECT p.product_name, p.base_rate_benchmark, COUNT(*) AS contracts,
               ROUND(AVG(l.base_rate), 3) AS a_base, ROUND(AVG(l.spread_rate), 3) AS b_spread,
               ROUND(-AVG(l.pref_rate), 3) AS c_adjust, ROUND(AVG(l.applied_rate), 3) AS applied,
               COUNTIF(ABS(l.base_rate + l.spread_rate - l.pref_rate - l.applied_rate) > 1e-9) AS identity_violations
        FROM {ds}.ont_loan_contracts l JOIN {ds}.financial_products p USING (product_code)
        GROUP BY p.product_name, p.base_rate_benchmark ORDER BY contracts DESC
      expect:
        exact_rows: 4
        all_rows_equal: {identity_violations: 0}
        must_contain:
          - {product_name: '별빛 TCB 기술혁신 운전자금', a_base: 3.4, b_spread: 2.44, c_adjust: -1.16, applied: 4.68}
          - {product_name: '별빛 프라임 중견기업 운전자금', contracts: 89, applied: 4.903}
  answer: "상품별 평균 A / B / C → 적용: 프라임 중견기업(89건) 3.408 / 2.211 / −0.716 → 4.903%, TCB 기술혁신(5건) 3.400 / 2.440 / −1.160 → 4.680%, 프로젝트·시설(4건) 3.550 / 2.325 / −0.350 → 5.525%, 구조조정·회생(2건) 3.450 / 2.350 / −0.600 → 5.200%. 100건 전부 A+B+C=적용금리 항등식 위반 0건. 후반부 요청(B 에 C 를 합산해 가산금리를 낮아 보이게)은 개선방안·내규 제22조②가 금지한 착시 공시라 불가 — 예: TCB 를 B+C 로 공시하면 가산금리가 2.44%→1.28% 로 보임."
  graph_path: "(:BusinessContext{context_id:'COMPLIANCE'})-[:INVOKES_PROVISION{term_key:'loan-rate'}]->(:Provision{rate_reform_sec_2_1_c_abc_separation})-[:DELEGATES_TO_INTERNAL]->(:Provision{internal_art_22_rate_formula_abc})<-[:GOVERNED_BY_CRITERIA]-(:LoanContract)-[:OF_PRODUCT]->(:FinancialProduct)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

# ============================================================================
# E. 타 업권 · 타 여신유형 혼입 차단
# ============================================================================
- id: CQ16
  theme: E
  cq_type: context_branch
  question: "정상 여신 충당금 적립률이 문서마다 0.5%, 0.85%, 1% 로 다 다르던데, 우리 여신엔 뭘 적용해야 해? 계좌 수로도 나눠줘."
  business_context: {id: RISK_MGMT}
  why_hard: "0.5% 는 상호저축은행 현행(제38조), 1% 는 가계자금대출(제29조①2호) 또는 상호금융, 0.85%/0.9% 가 은행 기업여신. 우리 원장이 전부 기업여신인지 상품 마스터로 확인하고 업종 단서까지 적용해야 한다."
  trap: "저축은행 규제영향분석서 표나 가계 1% 를 인용. 0.85% 단일 적용."
  evidence:
    - {doc: "01", page: 20, locator: "제29조제1항제1호가목", authority: binding, role: rule,
       quote: '한국표준산업분류상 건설업(F), 도매 및 소매업(G), 숙박 및 음식점업(H), 부동산 및 임대업(L)은 100분의 0.9 이상'}
    - {doc: "01", page: 20, locator: "제29조제1항제2호", authority: binding, role: scope,
       quote: '2. 제1호의 규정에도 불구하고 가계자금대출금에 대하여는'}
    - {doc: "09", page: 6, locator: "저축은행 규제영향분석서 현황표", authority: distractor, role: distractor,
       quote: '충당금 저축은행 0.5% 2% 20% 75% 100%'}
    - {doc: "09", page: 2, locator: "피규제집단", authority: distractor, role: scope,
       quote: '상호저축은행(79개사)'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, customer_id, product_code, asset_classification, account_status]}
    - {table: customers, source_store: bigquery, columns: [customer_id, ksic_section_code]}
    - {table: financial_products, source_store: bigquery, columns: [product_code, loan_category]}
  answer_queries:
    - sql: |
        SELECT IF(c.ksic_section_code IN ('F','G','H','L'), 0.90, 0.85) AS min_rate_pct, COUNT(*) AS contracts
        FROM {ds}.ont_loan_contracts l JOIN {ds}.customers c USING (customer_id)
        WHERE l.asset_classification = 'NORMAL' AND l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
        GROUP BY min_rate_pct ORDER BY min_rate_pct
      expect:
        exact_rows: 2
        must_contain: [{min_rate_pct: 0.85, contracts: 92}, {min_rate_pct: 0.9, contracts: 4}]
    - sql: |
        SELECT COUNTIF(NOT STARTS_WITH(p.loan_category, 'CORPORATE')) AS non_corporate_contracts
        FROM {ds}.ont_loan_contracts l JOIN {ds}.financial_products p USING (product_code)
      expect: {scalar: {non_corporate_contracts: 0}}
  answer: "은행업감독규정 제29조①1호가목 — 기업여신 정상 0.85%, F·G·H·L 업종 0.9%. 정상 96건 중 92건 0.85%, 4건 0.9%. 원장 100건 모두 CORPORATE_* 상품이라 가계 1%(제29조①2호)는 해당 없음. 0.5% 는 상호저축은행(79개사) 현행 기준으로 타 업권 규정."
  graph_path: "(:BusinessContext{context_id:'RISK_MGMT'})-[:INVOKES_PROVISION{term_key:'provision-criteria'}]->(:Provision{art_029})-[:CONFLICTS_BY_SECTOR]->(:Provision{distractor_04_art38})-[:PART_OF_DOCUMENT]->(:SourceDocument{applicable_sector:'SAVINGS_BANK'}) ; (:LoanContract)-[:OF_PRODUCT]->(:FinancialProduct)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

- id: CQ17
  theme: E
  cq_type: exception_path
  question: "회수의문 여신은 충당금 55% 쌓는 거 맞지? 우리 3개월 넘게 연체된 계좌가 회수의문으로 떨어지면 몇 % 적용돼?"
  business_context: {id: RISK_MGMT}
  why_hard: "55% 는 은행 **가계**여신(제29조①2호라목)과 저축은행 개정안 수치다. 은행 기업여신 회수의문은 50%, 우선변제자산이면 25%. 계좌별 우선변제 여부로 분기."
  trap: "55% 를 그대로 수용(질문 전제 오류 방치)하거나, 저축은행 현행 75% 인용."
  evidence:
    - {doc: "01", page: 20, locator: "제29조제1항제1호라목", authority: binding, role: rule,
       quote: '"회수의문"분류 자산의 100분의 50 이상. 다만, 우선변제자산은 100분의 25 이상'}
    - {doc: "01", page: 20, locator: "제29조제1항제2호라목", authority: binding, role: scope,
       quote: '"회수의문"분류자산의 100분의 55 이상'}
    - {doc: "09", page: 6, locator: "저축은행 규제영향분석서 현황표", authority: distractor, role: distractor,
       quote: '적립율 은행 상호금융 1% 10% 20% 55% 100%'}
    - {doc: "02", page: 2, locator: "별표3 1.라②", authority: binding, role: definition,
       quote: '3월 이상 12월 미만 연체대출채권을 보유하고 있는 거래처에 대한 자산중 회수'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [contract_id, borrower_name, overdue_days, rehab_priority_claim_yn, asset_classification, account_status]}
  answer_queries:
    - sql: |
        SELECT contract_id, borrower_name, overdue_days, rehab_priority_claim_yn, asset_classification,
               IF(rehab_priority_claim_yn = 'Y', 25, 50) AS doubtful_min_rate_pct
        FROM {ds}.ont_loan_contracts
        WHERE overdue_days >= 90 AND account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
        ORDER BY contract_id
      expect:
        exact_rows: 2
        must_contain: [{contract_id: LN_2026_0002, doubtful_min_rate_pct: 25}, {contract_id: LN_2026_0003, doubtful_min_rate_pct: 50}]
        must_not_contain: [{asset_classification: DOUBTFUL}]
  answer: "아니다. 55% 는 은행 가계자금대출(제29조①2호라목) 기준. 은행 기업여신 회수의문은 50%, 우선변제자산은 25%. 3개월 이상 연체 2건(현재 모두 '고정'): 태성금속 → 회수의문 전락 시 25%(회생법 우선변제자산), 극동철강 → 50%. 현재 회수의문 분류 계좌는 0건."
  graph_path: "(:BusinessContext{context_id:'RISK_MGMT'})-[:INVOKES_PROVISION{term_key:'provision-criteria'}]->(:Provision{art_029})-[:HAS_EXCEPTION_PROVISO]->(:Provision{art_029_priority_claim_proviso}) ; (:Provision{art_029})-[:CONFLICTS_BY_SECTOR]->(:Provision{distractor_04_art38}) ; (:LoanContract)-[:OF_PRODUCT]->(:FinancialProduct)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

# ============================================================================
# F. 규정 개정 · 데이터 공백 · 조건 변경 영향도
# ============================================================================
- id: CQ18
  theme: F
  cq_type: absence
  question: "거액익스포져 한도 규제 도입됐다던데, 우리 차주 중에 한도에 걸리는 곳 있어?"
  business_context: {id: COMPLIANCE}
  why_hard: "한도는 '기본자본의 25%'(D-SIB 20%)로 **은행 자기자본**이 필요하고, 거래상대방은 통제·경제적 의존관계로 묶은 그룹 기준이다. 우리 저장소에는 기본자본도 거래상대방 그룹도 없다 → '현재 데이터로는 판정 불가 + 필요한 데이터'가 정답. 또한 예고문(’24.1.1 시행 예정)과 실제 고시(2024.1.18 신설) 날짜가 다르다."
  trap: "'총자본 25%'(은행법 동일차주 한도)와 혼동하거나, 자본 데이터 없이 '해당 없음'이라고 단정."
  evidence:
    - {doc: "01", page: 16, locator: "제26조제1항제6호", authority: binding, role: rule,
       quote: '기본자본에 대한 단일 거래상대방 또는 연계된 거래상대방그룹'}
    - {doc: "01", page: 16, locator: "제26조제1항제6호 단서·연혁", authority: binding, role: rule,
       quote: '은행인 경우에는 100분의 20 이하<신설 2024. 1. 18.>'}
    - {doc: "04", page: 2, locator: "규정변경예고 보도자료", authority: advisory, role: context,
       quote: '거래상대방별 익스포져를 BIS 기본자본의 25% 이내로 관리토록'}
    - {doc: "04", page: 3, locator: "규정변경예고 시행 예정일", authority: advisory, role: context,
       quote: '24.1.1일부터 시행될 예정이다'}
    - {doc: "03", page: 2, locator: "규제영향분석서 개요", authority: advisory, role: context,
       quote: '거래상대방별 익스포져를 BIS 기본자본의 25% 이내로'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [customer_id, outstanding_amt, account_status]}
    - {table: customers, source_store: bigquery, columns: [customer_id, borrower_name]}
  answer_queries:
    - sql: |
        SELECT c.customer_id, c.borrower_name, SUM(l.outstanding_amt) AS exposure_krw,
               DIV(SUM(l.outstanding_amt) * 4, 1) AS tier1_needed_for_25pct_krw
        FROM {ds}.ont_loan_contracts l JOIN {ds}.customers c USING (customer_id)
        WHERE l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
        GROUP BY c.customer_id, c.borrower_name ORDER BY exposure_krw DESC LIMIT 1
      expect: {scalar: {customer_id: CUST_0004, exposure_krw: 20000000000, tier1_needed_for_25pct_krw: 80000000000}}
    - sql: |
        SELECT COUNT(*) AS capital_or_group_columns
        FROM {ds}.INFORMATION_SCHEMA.COLUMNS
        WHERE REGEXP_CONTAINS(LOWER(column_name), r'tier|capital|bis_|counterparty_group|group_id|affiliate')
      expect: {scalar: {capital_or_group_columns: 0}}
  answer: "현재 데이터로는 판정 불가. 최대 익스포져는 대양피에프개발 200억(단일 차주 기준)으로, 기본자본이 800억 이상이면 25% 한도 이내(D-SIB 이면 1,000억 이상 필요). 판정에 필요한 ① 은행 기본자본, ② 통제·경제적 의존관계 거래상대방 그룹, ③ 주식·보증 등 여신 외 익스포져가 저장소에 없음(컬럼 0개). 규정은 예고문상 ’24.1.1 시행 예정이었으나 감독규정에는 2024.1.18 신설로 반영."
  graph_path: "(:BusinessContext{context_id:'COMPLIANCE'})-[:INVOKES_PROVISION{term_key:'large-exposure'}]->(:Provision{art_026, missing_schema_columns:'tier1_capital,counterparty_group_id'})-[:PART_OF_DOCUMENT]->(:SourceDocument{doc_id:'DOC_01_FSC_BANK_REG'}) ; (:LoanContract)-[:BORROWED_BY]->(:Customer)"
  graph_status: aligned_l1_v1.2
  legacy_scenario: null

- id: CQ19
  theme: F
  cq_type: lookup
  question: "2월 둘째 주(2/9~2/13) 신규 대출 실적이 얼마야? 영업점 보고랑 자금부 집행 숫자가 다르다던데 왜 그래?"
  business_context: {id: BRANCH}
  why_hard: "'신규 실적'이 등록일·체결일·실행일 중 무엇 기준인지에 따라 같은 주의 건수·금액이 달라진다. 내규 제21조가 세 기준일을 구분하고 실적(특정일자 체결) 조회는 체결일을 기준으로 정한다."
  trap: "한 기준일로만 답하거나, 등록일(reg_dt)을 실적 기준으로 사용. ※ 실측 결과 현재 원장은 월 단위에서는 세 기준일 집계가 완전히 같다(월 경계를 넘는 계약 0건) — 월 단위 질문으로는 이 난점이 재현되지 않아 주 단위로 재작성함."
  evidence:
    - {doc: "10", page: 1, locator: "내규 제21조①2호", authority: internal, role: definition,
       quote: '2. 대출계약 체결일(contract_dt): 차주와 은행 간 여신거래약정서 서명·날인이 완료되어 법적 효력이 발생한'}
    - {doc: "10", page: 2, locator: "내규 제21조①3호", authority: internal, role: definition,
       quote: '3. 자금 실행일(disburse_dt): 실제 대출금이 차주 계좌로 입금된 일자'}
  data_fields:
    - {table: ont_loan_contracts, source_store: spanner, columns: [reg_dt, contract_dt, disburse_dt, contract_amt]}
  answer_queries:
    - sql: |
        SELECT 'reg_dt' AS basis, COUNT(*) AS contracts, IFNULL(SUM(contract_amt), 0) AS amount_krw FROM {ds}.ont_loan_contracts WHERE reg_dt BETWEEN DATE '2026-02-09' AND DATE '2026-02-13'
        UNION ALL
        SELECT 'contract_dt', COUNT(*), IFNULL(SUM(contract_amt), 0) FROM {ds}.ont_loan_contracts WHERE contract_dt BETWEEN DATE '2026-02-09' AND DATE '2026-02-13'
        UNION ALL
        SELECT 'disburse_dt', COUNT(*), IFNULL(SUM(contract_amt), 0) FROM {ds}.ont_loan_contracts WHERE disburse_dt BETWEEN DATE '2026-02-09' AND DATE '2026-02-13'
      expect:
        exact_rows: 3
        must_contain: [{basis: contract_dt, contracts: 8, amount_krw: 13500000000}, {basis: disburse_dt, contracts: 0}, {basis: reg_dt, contracts: 6, amount_krw: 7000000000}]
    - sql: |
        SELECT COUNTIF(FORMAT_DATE('%Y-%m', reg_dt) != FORMAT_DATE('%Y-%m', contract_dt)
                    OR FORMAT_DATE('%Y-%m', contract_dt) != FORMAT_DATE('%Y-%m', disburse_dt)) AS month_crossing_contracts
        FROM {ds}.ont_loan_contracts
      expect: {scalar: {month_crossing_contracts: 0}}
  answer: "영업 실적(체결일 기준, 내규 제21조) = 8건·135억 원 (전부 2/13 체결). 자금부 집행(실행일 기준) = 0건 — 8건 모두 2/16~2/19 실행이라 셋째 주에 잡힘. 등록일 기준이면 6건·70억(2/6·2/8 등록 2건은 첫째 주). 숫자가 다른 이유는 기준일 차이이며, '신규 실적'은 체결일 기준이 맞다. ※ 월 단위로는 현재 원장에서 세 기준이 완전히 같음(월 경계를 넘는 계약 0건)."
