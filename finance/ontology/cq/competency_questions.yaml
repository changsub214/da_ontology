# ---------------------------------------------------------------------------
# ontology/cq/competency_questions.yaml — 별빛은행 금융 온톨로지 Competency Questions (20)
#
# 근거 원칙 (ADR 0003)
#   · 비정형 근거 = OKF 로 변환되기 **전의 원본 PDF** (data/un_data/*.pdf). OKF 번들은 평가 대상이므로
#     CQ 의 근거로 쓰지 않는다(순환 논증 방지).
#   · 정형 근거 = **라이브 저장소**. Spanner `finance-cs/starlight_bank` 의 트랜잭션 5종은
#     BigQuery 표준 데이터셋의 연합 뷰 `ont_*` (Spanner external dataset → Data Boost) 로 읽고,
#     마스터 3종은 BigQuery `starlight_bank` 원본을 읽는다. = 향후 BigQuery Property Graph
#     `finance_graph` 가 순회할 바로 그 입력.
#   · 기대값(expect)은 summary_stats.json 이 아니라 **라이브 쿼리 실측**으로만 채운다.
#   · 검증: python tools/verify_cq.py [--negative-control]  → ontology/cq/cq_report.json
#
# graph_path 는 BigQuery Graph (`starlight_bank_ontology.finance_graph`)의 11 Node Classes · 15 Edge Views 라벨로 정규화됨 (ADR 0005 / F1).
# ---------------------------------------------------------------------------
meta:
  version: 1.1.0
  created: 2026-09-26
  updated: 2026-09-27
  owner: finance_ontology
  status: approved            # proposed -> approved (F1 11-class/15-edge 라벨 정렬 완료)
  theme_allocation: {A: 4, B: 3, C: 4, D: 4, E: 2, F: 3}
  themes:
    A: 건전성 분류 · 대손충당금 최소적립
    B: 부서별 연체율 정의 분기 (NPL / 공시 / EWS)
    C: 예외 · 특례 (별표3 라목 · 우선변제자산 · EOD 유예 · 특수채권)
    D: 금리 (A+B+C · 금리인하요구권 재량 · 전결 상한 · 기준일자)
    E: 타 업권 · 타 여신유형 규정 혼입 차단
    F: 규정 개정 · 데이터 공백 · 조건 변경 영향도
  cq_types:
    lookup: 단일 사실 조회이나 용어·컬럼 선택이 규정에 의해 결정됨
    multi_hop: 규정 → 단서 → 마스터 → 원장 등 3홉 이상 연결 필요
    exception_path: 원칙 조항과 예외·단서·재량 조항을 함께 평가해야 정답
    context_branch: 같은 용어가 부서/목적(BusinessContext)에 따라 다른 규정·컬럼으로 분기
    impact: 규정·조건 변경 시 영향받는 계약·금액을 역추적
    absence: "'해당 없음 / 데이터 없음' 이 정답 — 부재를 정확히 말해야 함"
  required_tables: [ont_loan_contracts, ont_collaterals, ont_delinquency_events,
                    ont_rate_cut_requests, ont_exception_approvals,
                    customers, financial_products, workout_histories]

  # 기존 6대 시나리오(S1~S6)의 비즈니스 현실성 판정 (사용자 요청: 현실적이면 흡수, 아니면 새 질문)
  legacy_scenario_review:
    S1: {verdict: realistic_but_leading, action: "CQ05·06·07 로 부서별 분리 재작성 (질문에 3개 정의를 미리 나열하지 않음)"}
    S2: {verdict: leading, action: "질문이 KSIC F·G·H·L 과 '정상'을 미리 알려줌 → CQ01 '정상 여신 대손준비금 추가 적립 필요?' 로 재작성 (실측 결과 장부 0.85% 적립으로 3,000만 원 부족이 실제로 드러남)"}
    S3: {verdict: realistic_but_leading, action: "CQ02·03·08·20 으로 분해 (고정 적립 / 우선변제 감경 범위 / 라목 특례 / 특례 철회 영향)"}
    S4: {verdict: realistic, action: "CQ14 로 유지 (단, 핵심 난점은 Text-to-SQL 컬럼 선택이지 GraphRAG 고유 강점은 아님을 명시)"}
    S5: {verdict: realistic, action: "CQ12 로 유지 + 거절 사유 통보 의무(05 p.4 ②) 추가"}
    S6: {verdict: not_business_question, action: "폐기 — PDF 해시 무결성은 고객 현업 질문이 아니라 플랫폼 검증 항목 (게이트로 이관)"}

business_contexts:
  RISK_MGMT:    {dept: 리스크관리부, purpose: "건전성 분류 · 대손충당금/대손준비금 · 리스크관리위원회 보고"}
  DISCLOSURE:   {dept: 재무기획부(공시), purpose: "금융감독원 대외공시 지표 산출"}
  CREDIT_MGMT:  {dept: 여신관리팀, purpose: "조기경보(EWS) · 사후관리 · 기한이익상실(EOD) 운영"}
  CREDIT_REVIEW: {dept: 기업여신심사부, purpose: "채권재조정 · 예외 승인 심사"}
  BRANCH:       {dept: 영업점(RM), purpose: "금리 산정 · 금리인하요구 응대 · 신규 실적"}
  COMPLIANCE:   {dept: 준법감시부, purpose: "규정 준수 점검 · 개정 영향도 · 공시 적정성"}

