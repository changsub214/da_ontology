# ---------------------------------------------------------------------------
# ontology/eval_question/eval_questions.yaml — RAG vs GraphRAG 평가 질문 20개 (사전등록 v1.1.0 → R4 실행 후 개정 v1.2.0, ADR 0013)
#
# 목적: "GraphRAG 가 이기도록 짠 시험"이라는 의심을 받지 않도록 **설계 단계에서** 공정성을 고정한다.
#
#  1) Hold-out: CQ 20개(ontology/cq/)는 온톨로지 설계 요구사항(=학습셋)이다. 평가 질문은 CQ 와
#     질문 문장·정답이 겹치지 않는다. 같은 규정을 쓰는 경우 sibling_cq 로 투명하게 표시한다.
#  2) 각 암의 고유 패러다임 + 동일 원장 가시성:
#     - RAG Agent: GCP Vertex AI RAG Engine(원본 PDF 10종 벡터 검색) + BigQuery SQL(starlight_bank + ont_* 관계형 쿼리)
#     - GraphRAG Agent (단일 통합 아키텍처, product/eval_arm 인위적 분리 없음):
#       입력 → 별칭(ont_entity_aliases 438행) & KC Aspect(ontology-class-anchors 고정 gql_match_template) 바인딩
#       → GQL 플래너 + BigQuery Dry-Run(dry_run=True) 검증 → KC 유효성 검증(kc_lookup: 실패 시 답변 불가 안내 /
#       통과 시 단일 통합 GQL graph_query 실행 + ObjectRef 서명 URL 원문 조회 fetch_provision).
#       (finance_graph 내부에 Spanner 연합 ont_* 및 BQ 원장 8종이 이미 노드로 통합되어 있으므로 별도 bigquery_sql 미사용)
#  3) 균형 배분 (사전 가설): GraphRAG 우세 예상 8 · RAG 우세 예상 6 · 동률 예상 6.
#     RAG 우세 6개는 온톨로지(LEX/브리지)에 모델링되지 않은 서술형 내용 — GraphRAG 가 **질 수 있는** 문항.
#  4) 사전등록: 각 문항의 expected_winner 와 근거를 실행 전에 고정. 결과가 가설과 다르면 그대로 보고한다.
#  5) 결정론적 채점: LLM-judge 없이 must_include / must_not_include 정규식 + 인용(문서·쪽) 대조.
#  6) 정답 근거는 CQ 와 동일한 게이트로 검증: 원본 PDF 원문 인용(verbatim) + 라이브 SQL 실측.
#     검증: python tools/verify_eval.py  → ontology/eval_question/eval_report.json
# ---------------------------------------------------------------------------
meta:
  version: 1.2.0
  created: 2026-09-26
  updated: 2026-09-28
  status: revised_post_run       # preregistered (v1.1.0) -> executed (R4 2026-09-27) -> revised_post_run (v1.2.0)
  allocation: {graph_favored: 8, rag_favored: 6, parity: 6}
  holdout_from: ontology/cq/competency_questions.yaml
  revisions:
    - version: 1.2.0
      date: 2026-09-28
      decider: user (00:38Z)
      adr: second_brain/decisions/0013-eq-post-run-revision-and-graphrag-free-path.md
      changes:
        - "EQ01: 질문 유지, 정답을 두 해석 모두 인정 (증액분만 1억 3,500만 / 기존 부족분 포함 1억 4,000만)"
        - "EQ02: 질문을 가정 명시형으로 변경 (회생절차 진행 서술 → 우선변제자산 인정 가정)"
        - "protocol.scoring.out_of_domain_rule 추가"
      note: "R4 결과를 본 뒤의 변경이다. v1.1.0 결과(ontology/eval_question/compare_run.json 첫 실행)는 log 2026-09-27 에 그대로 남긴다."

protocol:
  arms:
    rag:
      retrieval: "GCP Vertex AI RAG Engine — data/un_data/*.pdf 10종(142쪽) 벡터 인덱스 검색 + BigQuery 관계형 SQL"
      tools: [vertex_rag_search, bigquery_sql]
      note: "비정형 규정은 Vertex AI RAG Engine 으로 PDF 청크를 검색하고, 정형 원장은 bigquery_sql(starlight_bank.*)로 조회"
    graphrag:
      retrieval: "단일 통합 GraphRAG 파이프라인 — Alias(438행) & KC Aspect 고정 GQL 템플릿 바인딩 → GQL 플래너 + BQ Dry-Run 검증 → KC 유효성 검증(kc_lookup) → 단일 통합 GQL(graph_query) + ObjectRef 원문 조회(fetch_provision)"
      tools: [graph_query, kc_lookup, fetch_provision]
      note: "별도 bigquery_sql 및 벡터 검색 폴백 없음 — finance_graph 내부에 Spanner 연합 뷰(ont_*)와 BQ 원장 8종, 조문 ObjectRef 가 모두 통합되어 있어 GQL 한 번으로 그래프 순회·정량 집계를 완결하며, KC 유효성 실패 시 즉시 답변 불가 처리"
  shared:
    llm: "두 암 동일 모델(gemini-3.8-flash)·동일 버전(실행 시 resolved version 기록), temperature 0, seed 고정"
    system_prompt: "공통 역할·인용·산식 골격 동일. 암별 차이는 고유 패러다임(RAG Engine+SQL vs Unified GQL+KC+ObjectRef) 도구 문단만"
    tool_budget: "문항당 최대 tool call 12회, 동일"
    ledger_visibility: "동일 원장 데이터 가시성 보장 — RAG 암은 starlight_bank.* SQL 테이블로, GraphRAG 암은 동일 테이블을 바라보는 finance_graph 의 8대 LDM 노드 뷰(Spanner Data Boost 연합 포함)로 GQL 조회"
    runs: "문항당 3회 반복, 최빈 점수 채택 + 불일치 건수 공개"
  scoring:
    per_question: "2 = must_include 전부 + must_not_include 0 + 필수 인용 충족 / 1 = must_include 절반 이상 & must_not_include 0 / 0 = 그 외"
    citation: "필수 인용은 문서 id(01~10) 와 쪽(또는 조문) 표기로 판정"
    judge: "정규식 기반 결정론적 채점 (LLM-judge 미사용)"
    out_of_domain_rule: "GraphRAG 가 업무 범위 밖(OUT_OF_DOMAIN)으로 거절한 문항은 자동으로 GraphRAG 정답 · RAG 오답 (범위 통제). 사용자 결정 2026-09-28 00:38Z, ADR 0013. 구현: tools/run_eq_compare.py judge"
  preregistered_hypotheses:
    H1: "graph_favored 8문항에서 GraphRAG 평균 점수 > RAG 평균 점수 (최소 6/8 문항에서 우위)"
    H2: "rag_favored 6문항에서 RAG 평균 점수 ≥ GraphRAG 평균 점수"
    H3: "parity 6문항에서 두 암 점수 차 ≤ 1 인 문항이 5/6 이상"
    reporting: "H1~H3 가 기각되어도 전 문항·전 transcript 공개. 가설 수정 후 재실행 시 버전 증가 + 변경 사유 기록"

