questions:
# ============================================================================
# GRAPH-FAVORED (8) — 단서·예외·부서맥락·타업권 차단이 여러 문서/테이블에 흩어져 있음
# ============================================================================
- id: EQ01
  category: graph_favored
  sibling_cq: CQ01
  question: "그랜드하모니호텔 대출을 150억 증액하려고 해. 정상 분류 유지된다고 치면 최소 충당금이 얼마 더 필요해?"
  expected_winner: graphrag
  rationale: "RAG 는 SQL 로 KSIC 'H' 를 조회해도, 0.85% 원칙 문장과 같은 청크에 붙은 업종 단서를 'H=숙박 및 음식점업' 과 연결해야 한다. 그래프는 Customer.ksic → ExceptionRule(F·G·H·L) 엣지로 직접 도달."
  evidence:
    - {doc: "01", page: 20, quote: '한국표준산업분류상 건설업(F), 도매 및 소매업(G), 숙박 및 음식점업(H), 부동산 및 임대업(L)은 100분의 0.9 이상'}
  answer_queries:
    - sql: |
        SELECT c.borrower_name, c.ksic_section_code, DIV(15000000000 * 90, 10000) AS added_min_provision_krw
        FROM {ds}.customers c WHERE c.borrower_name = '그랜드하모니호텔(주)'
      expect: {scalar: {ksic_section_code: H, added_min_provision_krw: 135000000}}
    # v1.2.0: 기존 여신까지 본 해석 — 증액 후 총 잔액 × 0.9% − 기적립 충당금 (기존 100억이 0.85% 로 적립돼 500만 부족)
    - sql: |
        SELECT outstanding_amt, booked_provision_krw,
               DIV((outstanding_amt + 15000000000) * 90, 10000) - booked_provision_krw AS added_incl_shortfall_krw
        FROM {ds}.ont_loan_contracts WHERE borrower_name = '그랜드하모니호텔(주)'
      expect: {scalar: {outstanding_amt: 10000000000, booked_provision_krw: 85000000, added_incl_shortfall_krw: 140000000}}
  gold_answer: "1억 3,500만 원 (증액분 150억 × 0.9%, 숙박 및 음식점업 H 단서) 또는 1억 4,000만 원 (증액 후 250억 × 0.9% = 2억 2,500만 − 기적립 8,500만, 기존 100억이 0.85% 로 적립돼 생긴 부족분 500만 포함). 두 해석 모두 정답. 함정: 원칙 비율 0.85% 적용 금액(1억 2,750만)은 오답."
  grading:
    must_include: ['1억\s?3,?500만|135,000,000|1\.35억|1억\s?4,?000만|140,000,000|1\.4억', '0\.9']
    # 0.85% 금액을 must_not_include 로 두면 "0.85%면 ○○이지만 H 단서로 0.9%" 처럼 함정을 설명하는
    # 정답까지 감점된다 (verify_eval EQ-G5 가 gold 자기모순으로 검출). 오답은 must_include 에서 이미 탈락.
    must_not_include: []
    cite: [{doc: "01", locator: "제29조"}]

- id: EQ02
  category: graph_favored
  sibling_cq: CQ02
  question: "극동철강 채권이 우선변제자산으로 인정된다고 가정하면 법정 최소 충당금이 얼마나 줄어?"
  # v1.1.0 질문: "극동철강이 회생절차에 들어가서 법원에서 우리 채권 우선변제권이 인정되면, 충당금 부담이 얼마나 줄어?"
  # v1.2.0: 가정을 명시 (R4 에서 두 암 모두 원장 플래그 N/NONE 을 근거로 판단 보류). 정답은 그대로.
  expected_winner: graphrag
  rationale: "고정 20% 원칙 → 다목 단서(회생법 제180조② 우선변제자산 10%) 연결 + 원장 잔액·장부 충당금 결합. 단서가 같은 목 뒤에 이어져 RAG 도 찾을 수는 있으나 '고정' 분류 확인과 잔액 계산이 분산됨."
  evidence:
    - {doc: "01", page: 20, quote: '제180조제2항에 따라 은행이 우선하여 변제받을 권리가 인정되는 자산(이하 "우선변제자산"이라 한다)은 100분의 10 이상'}
  answer_queries:
    - sql: |
        SELECT contract_id, asset_classification, outstanding_amt, booked_provision_krw,
               DIV(outstanding_amt * 10, 100) AS min_if_priority_krw,
               DIV(outstanding_amt * 20, 100) - DIV(outstanding_amt * 10, 100) AS min_reduction_krw
        FROM {ds}.ont_loan_contracts WHERE borrower_name = '극동철강산업(주)'
      expect: {scalar: {asset_classification: SUBSTANDARD, min_if_priority_krw: 1000000000, min_reduction_krw: 1000000000}}
  gold_answer: "법정 최소 충당금이 20억(20%) → 10억(10%)으로 10억 원 감소. (현재 고정 분류, 잔액 100억)"
  grading:
    must_include: ['10억', '10\s?%|100분의\s?10', '20억|20\s?%']
    must_not_include: ['5억\s?원\s?감소']
    cite: [{doc: "01", locator: "제29조"}]

- id: EQ03
  category: graph_favored
  sibling_cq: CQ07
  question: "18일째 연체 중인 계좌들 있잖아. 건전성 분류는 뭐로 해야 하고, 여신관리팀 조기경보 대상이야?"
  expected_winner: graphrag
  rationale: "같은 '연체' 사실이 리스크(별표3: 1월 미만 → 정상)와 여신관리팀(내규 제14조: 10일 이상 → EWS 포함)에서 다르게 분기. 두 부서 맥락을 동시에 답해야 함."
  evidence:
    - {doc: "02", page: 1, quote: '1월 이상 3월 미만 연체대출채권을 보유하고 있는 거래처에 대한 자산'}
    - {doc: "10", page: 1, quote: '1. 분자: 10일 이상 원리금 연체 기업여신 잔액 + 30일 이상 관리연체 잔액 + 회계상 대손상각 처리되어 특수'}
  answer_queries:
    - sql: |
        SELECT l.contract_id, l.asset_classification, d.overdue_days, l.outstanding_amt
        FROM {ds}.ont_loan_contracts l JOIN {ds}.ont_delinquency_events d USING (contract_id)
        WHERE d.overdue_days = 18 ORDER BY l.contract_id
      expect: {exact_rows: 3, all_rows_equal: {asset_classification: NORMAL}, sum: {outstanding_amt: 15000000000}}
  gold_answer: "3건(각 50억, 합 150억). 건전성은 '정상' 유지(요주의는 1월 이상 연체부터). 여신관리팀 EWS 실질관리 연체율에는 포함(10일 이상)."
  grading:
    must_include: ['정상', '3\s?건|3개', '(EWS|조기경보).{0,30}(포함|대상)']
    must_not_include: ['요주의로\s?(분류|하향)']
    cite: [{doc: "02", locator: "별표3"}, {doc: "10", locator: "제14조"}]

- id: EQ04
  category: graph_favored
  sibling_cq: CQ06
  question: "여신관리팀이 관리하는 연체율 숫자를 그대로 금감원 공시 연체율로 내도 돼?"
  expected_winner: graphrag
  rationale: "두 정의가 한 조문(내규 제14조) 안에 있어 RAG 도 찾을 수 있으나, 각 정의로 실제 수치를 산출해 차이(4.00% vs 2.26%)와 원인(10일 기준·특수채권 포함)을 제시하려면 정의→컬럼 매핑이 필요."
  evidence:
    - {doc: "10", page: 1, quote: '금융감독원 대외공시용 원화대출 연체율(1월 이상 원리금 연체 기준, 대손상각 특수채권 제외)'}
    - {doc: "10", page: 1, quote: '2. 분모: 대차대조표상 원화 기업여신 총잔액 + 대손상각 특수채권 미회수 원금 잔액'}
  answer_queries:
    - sql: |
        WITH d AS (SELECT contract_id, MAX(overdue_days) od FROM {ds}.ont_delinquency_events WHERE write_off_yn = 'N' GROUP BY contract_id),
             wo AS (SELECT SUM(overdue_principal_krw) p FROM {ds}.ont_delinquency_events WHERE write_off_yn = 'Y')
        SELECT ROUND(100 * SUM(IF(d.od >= 30, l.outstanding_amt, 0)) / SUM(l.outstanding_amt), 2) AS official_pct,
               ROUND(100 * (SUM(IF(d.od >= 10, l.outstanding_amt, 0)) + ANY_VALUE(wo.p)) / (SUM(l.outstanding_amt) + ANY_VALUE(wo.p)), 2) AS ews_pct
        FROM {ds}.ont_loan_contracts l LEFT JOIN d USING (contract_id) CROSS JOIN wo
        WHERE l.account_status != 'WRITTEN_OFF_SPECIAL_CLAIM'
      expect: {scalar: {official_pct: 2.26, ews_pct: 4.0}}
  gold_answer: "안 된다. 공시는 1월 이상 연체·특수채권 제외 = 2.26%, 여신관리팀 EWS 는 10일 이상 + 상각 특수채권 포함 = 4.00%. 정의가 다른 지표."
  grading:
    must_include: ['안\s?(된다|됨|돼)|불가|부적절', '2\.26', '4\.0']
    must_not_include: []
    cite: [{doc: "10", locator: "제14조"}]

- id: EQ05
  category: graph_favored
  sibling_cq: CQ12
  question: "네오바이오텍 금리인하요구를 35bp 승인해준 게 내부 기준상 문제없는 결정이야?"
  expected_winner: graphrag
