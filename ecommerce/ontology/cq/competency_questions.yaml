cqs:
- id: CQ01
  theme: A
  cq_type: multi_hop
  persona: 그로스마케팅본부 AI추천랩 매니저
  question: 장바구니 미결제 이탈 세션(`SES-1001-A`)이 발생한 VIP 회원 김서연(`USR-1001`)에게 주상품 `PRD-3001`(발마칸 코트)과 코디 보완상품 `PRD-3002`(터틀넥 니트)
    번들 쿠폰을 제안할 때, 각 상품의 기본 마진율 및 체화재고 예외승인(`EXC-KM-2026-01`, 하한 10%)을 반영한 합산 최대 쿠폰 할인액과 최종 번들 제안가는 얼마인가?
  business_context:
    id: CX_GROWTH_MKT
  why_hard: 그로스마케팅본부 AI추천랩 매니저 맥락에서 법령·내규 조문과 Spanner/BigQuery 정형 원장을 다중 홉으로 결합해야 정확한 의사결정이 가능함.
  trap: 단일 규정만 보거나 예외승인 결재 상태(ACTIVE vs EXPIRED/REJECTED)·부서별 분모 차이를 누락하면 오답 산출.
  evidence:
  - doc: '07'
    pdf: 07_INTERNAL_K마켙_초개인화추천_및_CRM타겟팅_운영내규_2025.pdf
    page: 2
    locator: 제3조
    section: 제3조
    authority: internal
    role: rule
    quote: 제3조(가용재고 연동 대체상품 및 크로스셀 코디 번들 추천 규칙) ① 장바구니 이탈 고객 또는 상품 상세 조회 고객에게 상품을 추천할 때에는 먼저 물류 원장(`inventory_items`)의 실시
  - doc: '07'
    pdf: 07_INTERNAL_K마켙_초개인화추천_및_CRM타겟팅_운영내규_2025.pdf
    page: 2
    locator: 제4조~제5조
    section: 제4조~제5조
    authority: internal
    role: rule
    quote: 제4조(회원 등급별 타겟팅 쿠폰 할인율 상한 및 마진 가드레일 연동) ① 마케팅 수신동의(`marketing_opt_in = True`)가 확인된 회원에 대하여 부여할 수 있는 CRM 타겟팅 쿠폰의
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 1
    locator: 제1조~제2조
    section: 제1조~제2조
    authority: internal
    role: rule
    quote: 제1조(목적) 이 내규는 K마켙에서 판매되는 직매입·특약매입·위수탁 상품의 수익성을 방어하고 무분별한 할인쿠폰 남발로 인한 역마진을 방지하기 위하여, 상품 마진율 산정 산식과 상시 최저마진 가드레일
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 2
    locator: 제4조
    section: 제4조
    authority: internal
    role: rule
    quote: 제4조(캠페인 예외승인 원장 검증 및 우회 기준) ① 체화재고 완화 요건이나 상시 마진율 25% 기준에 대한 예외를 적용하여 CRM 번들 쿠폰이나 클리어런스 특가를 실행하려는 경우, 실시간 캠페인
  data_fields:
  - table: ont_events
    source_store: spanner
    columns:
    - event_type
    - user_id
    - session_id
    - product_id
  - table: users
    source_store: bigquery
    columns:
    - membership_tier
    - marketing_opt_in_yn
    - user_id
  - table: products
    source_store: bigquery
    columns:
    - cost_krw
    - retail_price_krw
    - coord_product_id
    - product_id
  - table: ont_inventory_items
    source_store: spanner
    columns:
    - age_days
    - product_id
  - table: ont_campaign_exceptions
    source_store: spanner
    columns:
    - approved_floor_margin_pct
    - approval_id
    - product_id
    - status
  answer_queries:
  - engine: bigquery_sql
    sql: "SELECT\n  u.user_id,\n  u.membership_tier,\n  u.marketing_opt_in_yn,\n  p1.product_id AS main_product_id,\n  p1.retail_price_krw\
      \ AS main_retail_krw,\n  ROUND((p1.retail_price_krw - p1.cost_krw) / p1.retail_price_krw, 2) AS main_base_margin,\n\
      \  p2.product_id AS coord_product_id,\n  p2.retail_price_krw AS coord_retail_krw,\n  ROUND((p2.retail_price_krw - p2.cost_krw)\
      \ / p2.retail_price_krw, 2) AS coord_base_margin,\n  inv2.age_days AS coord_age_days,\n  ce.approval_id,\n  ce.approved_floor_margin_pct,\n\
      \  CAST(p1.retail_price_krw * 0.15 + p2.retail_price_krw * 0.15 AS INT64) AS naive_rag_discount_krw,\n  CAST(p1.retail_price_krw\
      \ * 0.15 + FLOOR(p2.retail_price_krw - p2.cost_krw / (1.0 - ce.approved_floor_margin_pct / 100.0)) AS INT64) AS ontology_max_discount_krw,\n\
      \  CAST((p1.retail_price_krw + p2.retail_price_krw) - (p1.retail_price_krw * 0.15 + FLOOR(p2.retail_price_krw - p2.cost_krw\
      \ / (1.0 - ce.approved_floor_margin_pct / 100.0))) AS INT64) AS final_bundle_price_krw\nFROM `finance-ontology-changseop.kmarket_ecommerce.ont_events`\
      \ e\nJOIN `finance-ontology-changseop.kmarket_ecommerce.users` u ON e.user_id = u.user_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.products`\
      \ p1 ON e.product_id = p1.product_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.products` p2 ON p1.coord_product_id\
      \ = p2.product_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items` inv2 ON p2.product_id = inv2.product_id\n\
      JOIN `finance-ontology-changseop.kmarket_ecommerce.ont_campaign_exceptions` ce ON p2.product_id = ce.product_id AND\
      \ ce.status = 'ACTIVE'\nWHERE e.session_id = 'SES-1001-A' AND e.event_type = 'cart'"
    expect:
      exact_rows: 1
      must_contain:
      - user_id: USR-1001
        main_product_id: PRD-3001
        coord_product_id: PRD-3002
        approval_id: EXC-KM-2026-01
        naive_rag_discount_krw: 90000
        ontology_max_discount_krw: 86666
        final_bundle_price_krw: 513334
  answer: 라이브 BigQuery + Spanner 연합 쿼리(ont_*) 실측 결과 참조.
  graph_path: (:BusinessContext)-[:INVOKES_PROVISION]->(:Provision) ; (:UserBehaviorEvent)-[:LOGGED_EVENT_ON_PRODUCT]->(:Product)-[:STOCKED_AT_INVENTORY]->(:InventoryItem)
    ; (:Product)-[:HAS_CAMPAIGN_EXCEPTION]->(:CampaignException)
  graph_status: aligned_l1_v1.2
- id: CQ02
  theme: A
  cq_type: multi_hop
  persona: 그로스마케팅본부 CRM 캠페인 매니저
  question: 현재 물류 원장에서 실시간 가용재고가 0개인 일시품절(`avail_qty = 0`, `OUT_OF_STOCK`) 상품은 무엇이며, 공정위 다크패턴 가이드라인 제3조 및 K마켙 내규 제3조제1항에 따라
    전환 추천해야 할 대체 상품(`substitute_product_id`)의 입고 경과일수(`age_days`)와 가용재고 수량, 체화재고(`age_days >= 90` & `avail_qty >= 30`) 해당
    여부는 어떻게 되는가?
  business_context:
    id: CX_GROWTH_MKT
  why_hard: 그로스마케팅본부 CRM 캠페인 매니저 맥락에서 법령·내규 조문과 Spanner/BigQuery 정형 원장을 다중 홉으로 결합해야 정확한 의사결정이 가능함.
  trap: 단일 규정만 보거나 예외승인 결재 상태(ACTIVE vs EXPIRED/REJECTED)·부서별 분모 차이를 누락하면 오답 산출.
  evidence:
  - doc: '04'
    pdf: 04_FTC_전자상거래_다크패턴_및_맞춤형광고_가이드라인_2025.pdf
    page: 1
    locator: 제3조
    section: 제3조
    authority: advisory
    role: rule
    quote: 제3조(실시간 재고 및 품절 표시의 정확성) ① 사업자가 '품절 임박', '잔여 재고 N개' 등의 문구를 노출할 때에는 물류센터의 실시간 가용재고(`available_stock`) 원장 데이터와 일
  - doc: '07'
    pdf: 07_INTERNAL_K마켙_초개인화추천_및_CRM타겟팅_운영내규_2025.pdf
    page: 2
    locator: 제3조
    section: 제3조
    authority: internal
    role: rule
    quote: 제3조(가용재고 연동 대체상품 및 크로스셀 코디 번들 추천 규칙) ① 장바구니 이탈 고객 또는 상품 상세 조회 고객에게 상품을 추천할 때에는 먼저 물류 원장(`inventory_items`)의 실시
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 2
    locator: 제3조
    section: 제3조
    authority: internal
    role: rule
    quote: 제3조(체화재고의 정의 및 클리어런스 마진 하한 완화 특례) ① 물류 원장(`inventory_items`)상 입고 후 경과일수(`stock_age_days`)가 90일 이상이고 가용재고(`avai
  data_fields:
  - table: ont_inventory_items
    source_store: spanner
    columns:
    - avail_qty
    - stock_status
    - age_days
    - product_id
  - table: products
    source_store: bigquery
    columns:
    - substitute_product_id
    - product_id
    - product_name
  answer_queries:
  - engine: bigquery_sql
    sql: "SELECT\n  p.product_id AS stockout_product_id,\n  inv.avail_qty AS stockout_avail_qty,\n  p.substitute_product_id,\n\
      \  psub.product_name AS substitute_name,\n  inv_sub.age_days AS sub_age_days,\n  inv_sub.avail_qty AS sub_avail_qty,\n\
      \  (inv_sub.age_days >= 90 AND inv_sub.avail_qty >= 30) AS is_aged_clearance_eligible\nFROM `finance-ontology-changseop.kmarket_ecommerce.products`\
      \ p\nJOIN `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items` inv ON p.product_id = inv.product_id\n\
      JOIN `finance-ontology-changseop.kmarket_ecommerce.products` psub ON p.substitute_product_id = psub.product_id\nJOIN\
      \ `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items` inv_sub ON psub.product_id = inv_sub.product_id\n\
      WHERE inv.avail_qty = 0\nORDER BY p.product_id"
    expect:
      exact_rows: 2
      must_contain:
      - stockout_product_id: PRD-3009
        substitute_product_id: PRD-3002
        sub_age_days: 125
        sub_avail_qty: 50
        is_aged_clearance_eligible: true
      - stockout_product_id: PRD-3010
        substitute_product_id: PRD-3011
        sub_age_days: 105
        sub_avail_qty: 45
        is_aged_clearance_eligible: true
  answer: 라이브 BigQuery + Spanner 연합 쿼리(ont_*) 실측 결과 참조.
  graph_path: (:Product)-[:STOCKED_AT_INVENTORY]->(:InventoryItem) ; (:BusinessContext)-[:INVOKES_PROVISION]->(:Provision)
  graph_status: aligned_l1_v1.2
- id: CQ03
  theme: A
  cq_type: exception_path
  persona: MD본부 가격전략실 심사역
  question: 기본 마진율이 상시 가드레일(25.0%) 미만인 저마진 상품 3종(`PRD-3002`, `PRD-3005`, `PRD-3012`)에 대하여 입고 경과일수(`age_days`)와 캠페인 예외승인 원장(`campaign_exceptions`)의
    결재 상태(`ACTIVE` vs `EXPIRED`)를 대조할 때, 실제로 마진 하한 완화 특례가 적용되는 상품과 기각/차단되는 상품은 각각 무엇인가?
  business_context:
    id: MD_MERCHANDISING
  why_hard: MD본부 가격전략실 심사역 맥락에서 법령·내규 조문과 Spanner/BigQuery 정형 원장을 다중 홉으로 결합해야 정확한 의사결정이 가능함.
  trap: 단일 규정만 보거나 예외승인 결재 상태(ACTIVE vs EXPIRED/REJECTED)·부서별 분모 차이를 누락하면 오답 산출.
  evidence:
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 1
    locator: 제1조~제2조
    section: 제1조~제2조
