meta:
  version: 1.1.0
  created: '2026-10-06'
  updated: '2026-10-06'
  owner: ecommerce_ontology
  status: approved
  theme_allocation:
    A: 4
    B: 3
    C: 4
    D: 4
    E: 2
    F: 3
  themes:
    A: 초개인화 추천 · 장바구니 이탈 · 마진 가드레일 · 체화재고 (4)
    B: 부서·맥락별 지표 정의 분기 — 반품률·확정매출·가용재고 (3)
    C: 대규모유통업법 판촉비 50% 상한 · 서면약정 · 자발성 단서 (4)
    D: 전자상거래법 청약철회(7일 vs 90일) · 홀로그램 검수 · 물류 SLA · 해외직구 대조군 (4)
    E: 전사 파급효과 · 개인정보 동의 및 판촉비 정산 리스크 집계 (2)
    F: 스키마 공백(Absence) · 미매핑 법령 요건 진단 (3)
  cq_types:
    lookup: 단일 사실 조회이나 용어·컬럼 선택이 규정에 의해 결정됨
    multi_hop: 규정 → 단서 → 마스터 → 원장 등 3홉 이상 연결 필요
    exception_path: 원칙 조항과 예외·단서·결재 상태를 함께 평가해야 정답
    context_branch: 같은 용어가 본부/목적(BusinessContext)에 따라 다른 규정·컬럼으로 분기
    impact: 규정·조건 적용 시 전사 대상 계약·금액 파급효과 집계
    absence: 법령·내규상 요구되나 현재 원장에 없는 스키마 공백(missing_schema_columns) 진단
  required_tables:
  - ont_orders
  - ont_order_items
  - ont_inventory_items
  - ont_events
  - ont_campaign_exceptions
  - users
  - products
  - brand_vendor_contracts
business_contexts:
  CX_GROWTH_MKT:
    dept: 그로스마케팅본부 AI추천랩
    purpose: 초개인화 추천 · 장바구니 이탈 리타겟팅
  MD_MERCHANDISING:
    dept: MD본부 가격전략실
    purpose: 프로모션 쿠폰 마진 가드레일(25%) · 체화재고 특례
  PARTNER_SETTLEMENT:
    dept: 파트너상생본부 정산관리팀
    purpose: 대규모유통업법 판촉비 50% 상한 · 서면약정 · 수수료 정산
  CX_CS_REFUND:
    dept: 고객경험(CX)본부 CS심사팀
    purpose: 전자상거래법 청약철회(7일/90일) · 홀로그램 검수 · 반품배송비
  FULFILLMENT_OPS:
    dept: 풀필먼트운영실 물류관리팀
    purpose: 물류센터 가용재고 · 출고 SLA(24h/36h/48h) · 지연보상
  COMPLIANCE_AUDIT:
    dept: 준법감시실 · 개인정보보호팀
    purpose: 행태정보 수신동의 · 다크패턴 · 타업권 고시 혼입 차단
