    - doc: '07'
      locator: 제3조
    - doc: 08
      locator: 제3조
- id: EQ03
  category: graph_favored
  sibling_cq: CQ03
  question: 신상품 PRD-3012는 기본 마진율이 상시 가드레일(25%)에 미달하는데 이번 프로모션에서 할인이 차단되는지, 아니면 적용 가능한 최저마진율 하한이 몇 %인지 판정하라.
  expected_winner: graphrag
  rationale: 입고 35일차라 체화재고(90일+) 요건은 충족하지 못하지만, CampaignException 노드의 VIP_RETENTION 결재(EXC-KM-2026-07, 하한 12.0%, ACTIVE)를 통해 기본마진 22.0% 상품이 프로모션
    적격임을 추론해야 함.
  evidence:
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 1
    locator: 제1조~제2조
    section: 제1조~제2조
    authority: internal
    role: rule
    quote: 제1조(목적) 이 내규는 K마켙에서 판매되는 직매입·특약매입·위수탁 상품의 수익성을 방어하고 무분별한 할인쿠폰 남발로 인한 역마진을 방지하기 위하여, 상품 마진율 산정 산식과 상시 최저마진 가드레일 및 체화재고(악성재고) 클리어런스 특례
      기준을 정함을 목적으로 한다. 제2조(매출총이익률 산식 및 상시 프로모션 최저마진 25% 가드레일) ① 개별 상품의 프로모션 적용 후 매출총이익률(Gross Margin Ratio, 이하 "실현마진율"이라 한다)은 다음 산식에 의하여 계산한다.
      * 실현마진율 = (`sale_price_krw` - `cost_krw`) / `sale_price_krw` (여기서 `sale_price_krw`는 정상 판매가 `retail_price_krw`에서 쿠폰할인액 `coupon_discount_krw`를
      차감한 고객 실결제가격이며, `cost_krw`는 상품 매입원가이다.) ② 모든 상시 프로모션, CRM 타겟팅 쿠폰 및 코디 번들 할인 적용 시 개별 상품의 실현마진율은 100분의 25(25.0%) 이상을 유지하여야 한다(상시 최저마진 가드레일).
      ③ 기본 마진율(`(retail_price_krw - cost_krw) / retail_price_krw`)이 낮아 할인쿠폰 적용 시 실현마진율이 25.0% 미만으로 하락하는 저마진 상품은 원칙적으로 자동 할인쿠폰 적용 대상에서 제외(Block)하여야
      한다.
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 2
    locator: 제4조
    section: 제4조
    authority: internal
    role: rule
    quote: '제4조(캠페인 예외승인 원장 검증 및 우회 기준) ① 체화재고 완화 요건이나 상시 마진율 25% 기준에 대한 예외를 적용하여 CRM 번들 쿠폰이나 클리어런스 특가를 실행하려는 경우, 실시간 캠페인 예외승인 원장(`campaign_exceptions`)에
      승인 상태(`status = ''APPROVED''`)로 등록된 유효한 예외승인 코드(`exception_id`)가 존재하는지 확인하여야 한다. ② 적격 예외승인 유형(`exception_type`)은 다음 각 호와 같다. 1. `CLEARANCE_OVERRIDE`:
      체화재고(`stock_age_days >= 90`) 또는 시즌오프 재고 소진을 위하여 MD본부장이 최저마진 하한을 승인된 하한율(`approved_margin_floor`, 최소 10% 이상)까지 완화 승인한 건 2. `VIP_RETENTION`:
      VVIP·VIP 핵심 고객의 이탈 방지를 위하여 그로스마케팅본부장 및 MD본부장이 합의하여 코디 번들 구성 상품의 마진 하한을 한시적으로 완화 승인한 건 ③ 승인 상태가 기각(`REJECTED`)이거나 만료(`EXPIRED`)된 예외승인 건은
      가격결정 및 쿠폰 발급의 근거로 사용할 수 없다.'
  answer_queries:
  - sql: "SELECT\n  p.product_id,\n  inv.age_days,\n  ROUND((p.retail_price_krw - p.cost_krw) / p.retail_price_krw * 100, 1) AS base_margin_pct,\n\
      \  ce.approval_id,\n  ce.target_kind,\n  ce.approved_floor_margin_pct,\n  ce.status\nFROM `finance-ontology-changseop.kmarket_ecommerce.products`\
      \ p\nJOIN `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items` inv ON p.product_id = inv.product_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.ont_campaign_exceptions`\
      \ ce ON p.product_id = ce.product_id\nWHERE p.product_id = 'PRD-3012'"
    expect:
      scalar:
        product_id: PRD-3012
        age_days: 35
        base_margin_pct: 22.0
        approval_id: EXC-KM-2026-07
        approved_floor_margin_pct: 12.0
        status: ACTIVE
  gold_answer: 완화된 마진 하한이 적용되어 프로모션이 허용된다. PRD-3012는 입고 35일차로 체화재고(90일 이상)에는 해당하지 않으나, 유효한 VIP_RETENTION 예외승인(EXC-KM-2026-07, 승인 하한 12.0%, ACTIVE)이
    존재하므로 기본마진 22.0%에서 최저마진 하한 12.0%(12%)까지 할인 캠페인이 가능하다.
  grading:
    must_include:
    - EXC-KM-2026-07
    - 22(\.0)?%
    - 12(\.0)?%
    must_not_include: []
