    quote: 4. 납품업자 분담비율 50% 상한선 준수 및 초과분 처리 가. 법 제11조제4항에 따라 납품업자의 판매촉진비용 분담비율은 어떠한 경우에도 총 판매촉진비용(쿠폰 할인금액 총액 등)의 100분의 50을 초과할 수 없다. 나. 만약 대규모유통업자와
      납품업자 간 계약서상 분담비율(`promo_cost_share_ratio`)이 60% 또는 70% 등으로 약정되어 있더라도, 법정 상한인 50%를 초과하는 약정 부분은 강행규정 위반으로 당연 무효이다. 다. 따라서 대규모유통업자는 실제 쿠폰할인액의
      최대 50%까지만 납품업자 정산대금에서 공제할 수 있으며, 50%를 초과하는 나머지 금액은 대규모유통업자 자신의 마케팅 예산으로 전액 부담하여야 한다.
