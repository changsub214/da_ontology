questions:
- id: EQ01
  category: graph_favored
  sibling_cq: CQ01
  question: 박준혁 고객의 장바구니 미결제 세션(SES-1002-A)에 담긴 주상품과 연관 코디상품을 묶어 VIP 등급 최대 할인율로 번들 쿠폰을 제안할 때, 실제로 허용되는 합산 할인액과 최종 결제 제안 금액은 얼마인가?
  expected_winner: graphrag
  rationale: 장바구니 세션(SES-1002-A) → 주상품(PRD-3003, 정상가 200,000원, 원가 120,000원)은 15% 할인 시 실결제가 170,000원으로 할인 후 실현마진율 29.4% ≥ 25% 가드레일을 통과(30,000원
    할인)하나, 코디상품(PRD-3004, 정상가 100,000원, 원가 65,000원, 기본마진 35%)은 15% 할인 시 실결제가 85,000원으로 할인 후 실현마진율이 23.5% < 25.0%로 하락하며 비체화(입고 25일차)·예외승인 부재로 쿠폰
    할인이 차단(0원 할인, 정가 100,000원 유지)되어 합산 할인액 30,000원·최종 제안가 270,000원을 도출해야 함.
  evidence:
  - doc: '07'
    pdf: 07_INTERNAL_K마켙_초개인화추천_및_CRM타겟팅_운영내규_2025.pdf
    page: 2
    locator: 제3조
    section: 제3조
    authority: internal
    role: rule
    quote: 제3조(가용재고 연동 대체상품 및 크로스셀 코디 번들 추천 규칙) ① 장바구니 이탈 고객 또는 상품 상세 조회 고객에게 상품을 추천할 때에는 먼저 물류 원장(`inventory_items`)의 실시간 가용재고(`available_stock`)를
      확인하여야 한다. ② 고객이 관심을 보인 주상품의 가용재고가 0개인 품절 상태(`available_stock == 0`)인 경우에는 해당 상품에 대한 쿠폰 발급을 즉시 중단하고, 상품 마스터(`products`)에 지정된 동일 카테고리·유사 가격대의
      대체 추천 상품(`substitute_product_id`)을 우선 추천하여야 한다. ③ 주상품의 가용재고가 1개 이상 정상 확보(`available_stock >= 1`)되어 있는 경우에는 객단가(AOV) 증대를 위하여 상품 마스터(`products`)에
      연결된 연관 코디·보완 상품(`complementary_product_id`)을 함께 묶은 '코디 세트 번들(Cross-sell Bundle)'로 추천할 수 있다.
  - doc: '07'
    pdf: 07_INTERNAL_K마켙_초개인화추천_및_CRM타겟팅_운영내규_2025.pdf
    page: 2
    locator: 제4조~제5조
    section: 제4조~제5조
    authority: internal
    role: rule
    quote: '제4조(회원 등급별 타겟팅 쿠폰 할인율 상한 및 마진 가드레일 연동) ① 마케팅 수신동의(`marketing_opt_in = True`)가 확인된 회원에 대하여 부여할 수 있는 CRM 타겟팅 쿠폰의 최대 할인율은 회원 등급(`membership_tier`)별로
      다음과 같이 운영한다. 1. VVIP 및 VIP 등급 회원: 정상 판매가(`retail_price_krw`) 대비 최대 15% 할인쿠폰(단품 또는 코디 번들 전체 적용 가능) 2. GOLD 등급 회원: 정상 판매가 대비 최대 10% 할인쿠폰 3.
      SILVER 등급 회원: 정상 판매가 대비 최대 5% 할인쿠폰 ② 제1항에 따른 쿠폰을 발급할 때에는 개별 상품별로 쿠폰 적용 후 실결제가격(`sale_price_krw`) 기준 매출총이익률이 「K마켙 MD 상품마진 가드레일 및 체화재고 가격결정
      내규」 제2조의 상시 최저마진율(25%) 이상인지 반드시 사전 검증하여야 한다. 만약 번들 내 특정 상품의 쿠폰 적용 후 마진율이 25% 미만으로 하락하는 경우에는 해당 상품에 대한 체화재고 완화 특례(내규 제3조) 또는 MD본부 사전 예외승인(`campaign_exceptions`)이
      존재하는 때에만 쿠폰 적용을 허용한다. 제5조(야간 발송 차단 및 추천 투명성 문구 표기) ① 모든 CRM 리마인드 푸시 및 알림톡은 오전 08:00부터 오후 21:00 사이에만 발송하며, 21:00 이후 발생한 장바구니 이탈 건은 익일 오전
      08:30에 예약 발송한다. ② 코디 번들 및 대체상품 추천 카드 하단에는 ''고객님의 최근 장바구니 및 관심 상품을 기반으로 추천되었습니다''라는 투명성 안내 문구를 필수 표기한다.'
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 1
    locator: 제1조~제2조
    section: 제1조~제2조
    authority: internal
    role: rule
    quote: 제1조(목적) 이 내규는 K마켙에서 판매되는 직매입·특약매입·위수탁 상품의 수익성을 방어하고 무분별한 할인쿠폰 남발로 인한 역마진을 방지하기 위하여, 상품 마진율 산정 산식과 상시 최저마진 가드레일 및 체화재고(악성재고) 클리어런스 특례
      기준을 정함을 목적으로 한다. 제2조(매출총이익률 산식 및 상시 프로모션 최저마진 25% 가드레일) ① 개별 상품의 프로모션 적용 후 매출총이익률(Gross Margin Ratio, 이하 "실현마진율"이라 한다)은 다음 산식에 의하여 계산한다.
      * 실현마진율 = (`sale_price_krw` - `cost_krw`) / `sale_price_krw` (여기서 `sale_price_krw`는 정상 판매가 `retail_price_krw`에서 쿠폰할인액 `coupon_discount_krw`를
      차감한 고객 실결제가격이며, `cost_krw`는 상품 매입원가이다.) ② 모든 상시 프로모션, CRM 타겟팅 쿠폰 및 코디 번들 할인 적용 시 개별 상품의 실현마진율은 100분의 25(25.0%) 이상을 유지하여야 한다(상시 최저마진 가드레일).
      ③ 기본 마진율(`(retail_price_krw - cost_krw) / retail_price_krw`)이 낮아 할인쿠폰 적용 시 실현마진율이 25.0% 미만으로 하락하는 저마진 상품은 원칙적으로 자동 할인쿠폰 적용 대상에서 제외(Block)하여야
      한다.
  answer_queries:
  - sql: "SELECT\n  u.user_id,\n  u.membership_tier,\n  p1.product_id AS main_product_id,\n  ROUND((p1.retail_price_krw * 0.85 - p1.cost_krw)\
      \ / (p1.retail_price_krw * 0.85) * 100, 1) AS main_realized_margin_pct,\n  p2.product_id AS coord_product_id,\n  ROUND((p2.retail_price_krw\
      \ * 0.85 - p2.cost_krw) / (p2.retail_price_krw * 0.85) * 100, 1) AS coord_realized_margin_pct,\n  inv2.age_days AS coord_age_days,\n  CAST(p1.retail_price_krw\
      \ * 0.15 AS INT64) AS allowed_coupon_discount_krw,\n  CAST(p1.retail_price_krw * 0.85 + p2.retail_price_krw AS INT64) AS final_bundle_price_krw\n\
      FROM `finance-ontology-changseop.kmarket_ecommerce.ont_events` e\nJOIN `finance-ontology-changseop.kmarket_ecommerce.users` u ON e.user_id\
      \ = u.user_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.products` p1 ON e.product_id = p1.product_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.products`\
      \ p2 ON p1.coord_product_id = p2.product_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items` inv2 ON p2.product_id\
      \ = inv2.product_id\nWHERE e.session_id = 'SES-1002-A' AND e.event_type = 'cart'"
    expect:
      scalar:
        user_id: USR-1002
        membership_tier: VIP
        main_product_id: PRD-3003
        main_realized_margin_pct: 29.4
        coord_product_id: PRD-3004
        coord_realized_margin_pct: 23.5
        coord_age_days: 25
        allowed_coupon_discount_krw: 30000
        final_bundle_price_krw: 270000
  gold_answer: 합산 쿠폰 할인액은 30,000원이며 최종 번들 결제 제안 금액은 270,000원이다. 주상품 PRD-3003(정상가 200,000원, 매입원가 120,000원)은 15% 할인(30,000원) 시 실결제가 170,000원 기준
    실현마진율이 29.4%로 상시 가드레일(25.0%)을 충족하지만, 코디상품 PRD-3004(정상가 100,000원, 매입원가 65,000원, 기본마진 35.0%)는 15% 할인(15,000원) 시 실결제가 85,000원 기준 실현마진율이 23.5%로
    하락하여 상시 최저마진율(25.0%)에 미달하고, 입고 경과일수 25일차(비체화) 및 예외승인 부재로 쿠폰 할인이 차단(0원 할인, 정가 100,000원 유지)되기 때문이다.
  grading:
    must_include:
    - 30,?000
    - 270,?000
    - 23\.5%
    must_not_include:
    - 255,?000
    cite:
    - doc: '07'
      locator: 제3조
    - doc: 08
      locator: 제1조~제2조
- id: EQ02
  category: graph_favored
  sibling_cq: CQ02
  question: 장바구니 세션 SES-1007-A에서 고객이 담은 상품 PRD-3009는 현재 출고 가능한 재고가 있는가? 품절이라면 대체 추천해야 할 상품 코드와 그 대체상품에 프로모션 할인을 적용할 때 유지해야 하는 최저마진율 하한은 몇 %인가?
  expected_winner: graphrag
  rationale: 행동로그(SES-1007-A) → 주상품(PRD-3009) 재고(avail_qty=0 품절) 확인 → 대체상품(PRD-3002) 전환 → 대체상품 입고 경과일수(125일, 50개) 및 MD 내규 제3조(체화재고 10% 마진 하한 완화)까지
    다중 홉 그래프 순회가 필요함.
  evidence:
  - doc: '04'
    pdf: 04_FTC_전자상거래_다크패턴_및_맞춤형광고_가이드라인_2025.pdf
    page: 1
    locator: 제3조
    section: 제3조
    authority: advisory
    role: rule
    quote: 제3조(실시간 재고 및 품절 표시의 정확성) ① 사업자가 '품절 임박', '잔여 재고 N개' 등의 문구를 노출할 때에는 물류센터의 실시간 가용재고(`available_stock`) 원장 데이터와 일치하여야 한다. ② 가용재고가 0개인
      품절 상품(`available_stock == 0`)을 미끼상품으로 노출하면서 구매 단계에서만 품절 사실을 고지하는 행위는 금지되며, 품절 시에는 즉시 '일시품절' 상태를 명시하고 동일 카테고리·가격대의 대체 상품(`substitute_product_id`)을
      객관적 기준에 따라 안내할 수 있다.
