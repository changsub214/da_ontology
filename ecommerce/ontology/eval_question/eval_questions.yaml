- id: EQ15
  category: parity
  sibling_cq: CQ06
  question: 주문품목 OIT-2026-0001에 쿠폰 할인이 적용된 후의 단건 실현마진율은 소수 첫째 자리 기준 몇 %이며, MD본부 상시 마진 가드레일을 충족하는가?
  expected_winner: tie
  rationale: 단일 주문품목(OIT-2026-0001)과 상품 원가(PRD-3001)를 조인해 실현마진율 산식((340,000-240,000)/340,000 = 29.4%)을 계산하는 기본 문항으로 두 암 모두 정확히 수행 가능함.
  evidence:
  - doc: 08
    pdf: 08_INTERNAL_K마켙_MD상품마진_및_체화재고_가격결정_내규_2025.pdf
    page: 1
    locator: 제1조~제2조
    section: 제1조~제2조
    authority: internal
    role: rule
    quote: 제1조(목적) 이 내규는 K마켙에서 판매되는 직매입·특약매입·위수탁 상품의 수익성을 방어하고 무분별한 할인쿠폰 남발로 인한 역마진을 방지하기 위하여, 상품 마진율 산정 산식과 상시 최저마진 가드레일 및 체화재고(악성재고) 클리어런스 특례
      기준을 정함을 목적으로 한다. 제2조(매출총이익률 산식 및 상시 프로모션 최저마진 25% 가드레일) ① 개별 상품의 프로모션 적용 후 매출총이익률(Gross Margin Ratio, 이하 "실현마진율"이라 한다)은 다음 산식에 의하여 계산한다.
      * 실현마진율 = (`sale_price_krw` - `cost_krw`) / `sale_price_krw` (여기서 `sale_price_krw`는 정상 판매가 `retail_price_krw`에서 쿠폰할인액 `coupon_discount_krw`를
      차감한 고객 실결제가격이며, `cost_krw`는 상품 매입원가이다.) ② 모든 상시 프로모션, CRM 타겟팅 쿠폰 및 코디 번들 할인 적용 시 개별 상품의 실현마진율은 100분의 25(25.0%) 이상을 유지하여야 한다(상시 최저마진 가드레일).
      ③ 기본 마진율(`(retail_price_krw - cost_krw) / retail_price_krw`)이 낮아 할인쿠폰 적용 시 실현마진율이 25.0% 미만으로 하락하는 저마진 상품은 원칙적으로 자동 할인쿠폰 적용 대상에서 제외(Block)하여야
      한다.
  answer_queries:
  - sql: "SELECT\n  oi.item_id,\n  oi.sale_price_krw,\n  p.cost_krw,\n  ROUND((oi.sale_price_krw - p.cost_krw) / oi.sale_price_krw * 100, 1) AS\
      \ realized_margin_pct\nFROM `finance-ontology-changseop.kmarket_ecommerce.ont_order_items` oi\nJOIN `finance-ontology-changseop.kmarket_ecommerce.products`\
      \ p ON oi.product_id = p.product_id\nWHERE oi.item_id = 'OIT-2026-0001'"
    expect:
      scalar:
        item_id: OIT-2026-0001
        sale_price_krw: 340000
        cost_krw: 240000
        realized_margin_pct: 29.4
  gold_answer: OIT-2026-0001의 실현마진율은 (실결제가 340,000원 - 매입원가 240,000원) / 340,000원 = 29.4%이며, MD본부 상시 최저마진 가드레일(25.0%)을 충족한다.
  grading:
    must_include:
    - 29\.4%
    - 25(\.0)?%
    must_not_include: []
    cite:
    - doc: 08
      locator: 제1조~제2조
- id: EQ16
  category: parity
