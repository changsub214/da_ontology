      실제로 부담하는 판매촉진비용 분담비율은 총 쿠폰할인액(`coupon_discount_krw`)의 100분의 50(50.0%)을 초과할 수 없다. ② 입점브랜드 계약 원장(`brand_vendor_contracts`)에 기재된 약정 판촉비 분담률(`promo_cost_share_ratio`)이
      0.50(50%)을 초과하는 경우(예: `promo_cost_share_ratio = 0.60` 즉 60% 약정), 정산 시에는 법정 상한인 0.50(50%)으로 자동 캡(Cap)을 씌워 산정하며, 약정 분담률과 법정 상한(50%)의 차액에 해당하는
      초과분은 전액 K마켙이 흡수하여 부담한다. ③ 구체적인 주문건별·브랜드별 쿠폰 분담금 정산 산식은 다음과 같다. 1. 약정 기준 브랜드 분담액(캡 적용 전) = `coupon_discount_krw` × `promo_cost_share_ratio`
      2. 법정 유효 브랜드 분담률 = `MIN(promo_cost_share_ratio, 0.50)` (단, 제4조의 자발적 차별화 행사 예외 승인 건은 제외) 3. 최종 브랜드 정산 공제액(납품업자 실부담액) = `coupon_discount_krw`
      × `MIN(promo_cost_share_ratio, 0.50)` 4. K마켙 최종 부담액 = `coupon_discount_krw` - 최종 브랜드 정산 공제액 (여기에는 법 제11조제4항에 따라 K마켙이 의무 흡수한 50% 초과분 `coupon_discount_krw
      × MAX(0, promo_cost_share_ratio - 0.50)`이 포함된다.)'
