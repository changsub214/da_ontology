- id: EQ08
  category: graph_favored
  sibling_cq: CQ15
  question: 물류센터별 출고 목표 SLA를 위반한 지연 출고 주문들에 대해 K마켙이 지급해야 할 지연보상 적립금의 전사 합계 포인트와 물류센터별 지연 건수는 각각 얼마인가?
  expected_winner: graphrag
  rationale: Order(주문·출고 시각) → OrderItem → InventoryItem(물류센터 코드) → CS 내규 제4조(센터별 SLA 목표시간 및 건당 3,000P 보상)를 연결해 전사 지연 건수(3건)와 보상 합계(9,000P)를 집계해야
    함.
  evidence:
  - doc: '10'
    pdf: 10_INTERNAL_K마켙_CS반품환불_및_물류SLA_보상내규_2025.pdf
    page: 2
    locator: 제4조
    section: 제4조
    authority: internal
    role: rule
    quote: '제4조(물류센터별 출고 SLA 기준 및 출고지연 자동 보상) ① 풀필먼트운영실은 물류 원장(`inventory_items`)에 지정된 물류센터(`distribution_center`)별 표준 출고 목표시간(`sla_hours`)을 다음과
      같이 관리한다. 1. 김포 자동화 풀필먼트 센터(`GIMPO-FC`): 주문결제 시각(`orders.created_at`)으로부터 24시간 이내 출고(`sla_hours = 24`) 2. 용인 패션 허브 센터(`YONGIN-FC`): 주문결제
      시각으로부터 36시간 이내 출고(`sla_hours = 36`) 3. 양산 남부권 광역 센터(`YANGSAN-FC`): 주문결제 시각으로부터 48시간 이내 출고(`sla_hours = 48`) ② 실제 출고 시각(`orders.shipped_at`)과
      주문결제 시각(`orders.created_at`)의 차이(출고 소요시간)가 해당 상품 출고 물류센터의 `sla_hours`를 초과한 경우(출고 SLA 위반), 고객의 별도 클레임 제기가 없더라도 배송완료 즉시 고객에게 ''약속출고 지연 보상
      적립금 3,000포인트(3,000원 상당)''를 자동 지급한다.'
  answer_queries:
  - sql: "WITH sla_breach AS (\n  SELECT\n    o.order_id,\n    inv.distribution_center_id,\n    TIMESTAMP_DIFF(TIMESTAMP(o.shipped_at), TIMESTAMP(o.created_at),\
      \ HOUR) AS elapsed_hours\n  FROM `finance-ontology-changseop.kmarket_ecommerce.ont_orders` o\n  JOIN `finance-ontology-changseop.kmarket_ecommerce.ont_order_items`\
      \ oi ON o.order_id = oi.order_id\n  JOIN `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items` inv ON oi.inventory_item_id\
      \ = inv.inventory_item_id\n  WHERE TIMESTAMP_DIFF(TIMESTAMP(o.shipped_at), TIMESTAMP(o.created_at), HOUR) >\n    CASE inv.distribution_center_id\
      \ WHEN 'DC-ICN' THEN 24 WHEN 'DC-YIN' THEN 36 WHEN 'DC-BUS' THEN 48 END\n)\nSELECT\n  COUNT(*) AS total_breach_orders,\n  COUNTIF(distribution_center_id\
      \ = 'DC-YIN') AS dc_yin_breach_cnt,\n  COUNTIF(distribution_center_id = 'DC-BUS') AS dc_bus_breach_cnt,\n  COUNT(*) * 3000 AS total_compensation_points\n\
      FROM sla_breach"
    expect:
      scalar:
        total_breach_orders: 3
        dc_yin_breach_cnt: 2
        dc_bus_breach_cnt: 1
        total_compensation_points: 9000
  gold_answer: 'SLA 위반 지연 출고 주문은 총 3건(용인 DC-YIN 2건: ORD-2026-0009 60시간, ORD-2026-0014 42시간 / 양산 DC-BUS 1건: ORD-2026-0015 60시간)이며, 건당 3,000P씩 전사
    합계 9,000P의 지연보상 적립금을 지급해야 한다.'
  grading:
    must_include:
    - 3건
    - 9,?000P
    - 3,?000P
    must_not_include: []
    cite:
    - doc: '10'
      locator: 제4조
