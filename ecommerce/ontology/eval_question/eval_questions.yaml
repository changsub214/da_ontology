- id: EQ18
  category: parity
  sibling_cq: CQ13
  question: 배송완료 후 3일 만에 단순변심으로 반품 접수된 주문품목 OIT-2026-0007의 청약철회 적격 여부, 차감할 왕복 반품배송비, 그리고 고객에게 최종 환급할 금액은 얼마인가?
  expected_winner: tie
  rationale: 단순변심 7일 이내 반품 적격 판정 및 표준 왕복 반품배송비 6,000원 차감(200,000 - 6,000 = 194,000원)은 두 암 모두 명확히 계산 가능함.
  evidence:
  - doc: '03'
    pdf: 03_LAW_전자상거래법_전문_2025.pdf
    page: 2
    locator: 제17조제1항
    section: 제17조제1항
    authority: binding
    role: rule
    quote: 제17조(청약철회등) ① 통신판매업자와 재화등의 구매에 관한 계약을 체결한 소비자는 다음 각 호의 기간(거래당사자가 다음 각 호의 기간보다 긴 기간으로 약정한 경우에는 그 기간을 말한다) 이내에 당해 계약에 관한 청약철회등을 할 수 있다.
      1. 제13조제2항에 따른 계약내용에 관한 서면을 받은 날부터 7일. 단, 그 서면을 받은 때보다 재화등의 공급이 늦게 이루어진 경우에는 재화등을 공급받거나 재화등의 공급이 시작된 날부터 7일(단순변심에 의한 반품·청약철회) 2. 재화등의 내용이
      표시·광고의 내용과 다르거나 계약내용과 다르게 이행된 경우에는 당해 재화등을 공급받은 날부터 3개월 이내, 그 사실을 안 날 또는 알 수 있었던 날부터 30일 이내(표시·광고 상이 또는 오배송·불량에 의한 반품·청약철회)
  - doc: '10'
    pdf: 10_INTERNAL_K마켙_CS반품환불_및_물류SLA_보상내규_2025.pdf
    page: 1
    locator: 제1조~제2조
    section: 제1조~제2조
    authority: internal
    role: rule
    quote: '제1조(목적) 이 내규는 K마켙에서 발생한 고객 주문(`orders`, `order_items`)의 반품·청약철회 심사와 환불 기한 관리, 그리고 국내 풀필먼트 물류센터의 출고 서비스수준협약(SLA) 위반 시 고객 보상 기준을 명확히
      하여 「전자상거래 등에서의 소비자보호에 관한 법률」을 준수하고 고객 신뢰를 제고함을 목적으로 한다. 제2조(반품 사유 코드별 청약철회 가능 기한 및 반품배송비 귀속) ① CS 심사의원 및 자동화 에이전트는 주문 원장(`orders`)의 배송완료
      시각(`delivered_at`), 반품요청 시각(`return_requested_at`) 및 주문상품 원장(`order_items`)의 반품 사유 코드(`return_reason_code`)를 대조하여 다음과 같이 청약철회 적격성 및 배송비
      부담 주체를 판정한다. 1. 단순변심(`return_reason_code = ''CHANGE_OF_MIND''`): 전자상거래법 제17조제1항제1호에 따라 배송완료일(`delivered_at`)로부터 7일 이내에 반품이 요청된 경우 청약철회를
      승인하되, 왕복 반품배송비 6,000원은 고객 부담(환불금액에서 차감 또는 별도 결제)으로 처리한다. 다만, 외부 착용 흔적·세탁·수선·택(Tag) 파손으로 재판매 가치가 현저히 감소한 경우(`WEAR_AND_WASH_DAMAGE`)에는 법 제17조제2항제2호에
      따라 청약철회를 거절하고 상품을 고객에게 반송한다. 2. 표시·광고 내용 상이 또는 실측 사이즈 오기재(`return_reason_code = ''SIZE_MISMATCH_SPEC_DIFF''`): 상품 상세페이지에 표기된 실측 치수·소재 정보가
      실제 배송된 상품과 다른 경우에는 전자상거래법 제17조제1항제2호의 ''표시·광고 내용과 다르게 이행된 경우''에 해당하므로, 단순변심 7일 기한이 경과하였더라도 배송완료일로부터 3개월(90일) 이내(안 날로부터 30일 이내)에는 청약철회를 무조건
      승인하여야 하며, 반품배송비(6,000원)는 K마켙(또는 귀책 입점브랜드)이 전액 부담(무상반품)한다. 3. 상품 불량·파손·오배송(`return_reason_code = ''DEFECTIVE''`): 배송완료일로부터 3개월 이내 청약철회를 승인하며,
      반품배송비는 판매자 측이 전액 부담하고 고객에게 사과 포인트 2,000P를 추가 지급한다.'
  answer_queries:
  - sql: "SELECT\n  oi.item_id,\n  oi.sale_price_krw,\n  6000 AS return_ship_fee_krw,\n  oi.sale_price_krw - 6000 AS net_refund_krw\nFROM `finance-ontology-changseop.kmarket_ecommerce.ont_order_items`\
      \ oi\nWHERE oi.item_id = 'OIT-2026-0007'"
    expect:
      scalar:
        item_id: OIT-2026-0007
        sale_price_krw: 200000
        return_ship_fee_krw: 6000
        net_refund_krw: 194000
  gold_answer: 배송완료 후 7일 이내(3일 경과)에 신청되었으므로 전자상거래법 제17조제1항에 따라 청약철회가 승인되며, 단순변심 사유이므로 고객 부담 왕복 반품배송비 6,000원을 차감한 194,000원을 최종 환급한다.
  grading:
    must_include:
    - 6,?000
    - 194,?000
    - 7일
    must_not_include: []
    cite:
    - doc: '03'
      locator: 제17조제1항
    - doc: '10'
      locator: 제1조~제2조
- id: EQ19
  category: parity
  sibling_cq: CQ07
  question: 물류센터 재고 원장 전체 32개 항목을 재고상태별로 집계할 때 각 상태의 항목 수와 수량 합계는 얼마인가?
  expected_winner: tie
  rationale: 단일 재고 원장 테이블의 상태별 집계 쿼리로 두 암 모두 동일하게 조회 가능함.
  evidence:
  - doc: '07'
    pdf: 07_INTERNAL_K마켙_초개인화추천_및_CRM타겟팅_운영내규_2025.pdf
    page: 2
    locator: 제3조
    section: 제3조
    authority: internal
    role: rule
    quote: 제3조(가용재고 연동 대체상품 및 크로스셀 코디 번들 추천 규칙) ① 장바구니 이탈 고객 또는 상품 상세 조회 고객에게 상품을 추천할 때에는 먼저 물류 원장(`inventory_items`)의 실시간 가용재고(`available_stock`)를
      확인하여야 한다. ② 고객이 관심을 보인 주상품의 가용재고가 0개인 품절 상태(`available_stock == 0`)인 경우에는 해당 상품에 대한 쿠폰 발급을 즉시 중단하고, 상품 마스터(`products`)에 지정된 동일 카테고리·유사 가격대의
      대체 추천 상품(`substitute_product_id`)을 우선 추천하여야 한다. ③ 주상품의 가용재고가 1개 이상 정상 확보(`available_stock >= 1`)되어 있는 경우에는 객단가(AOV) 증대를 위하여 상품 마스터(`products`)에
      연결된 연관 코디·보완 상품(`complementary_product_id`)을 함께 묶은 '코디 세트 번들(Cross-sell Bundle)'로 추천할 수 있다.
  answer_queries:
  - sql: "SELECT\n  stock_status,\n  COUNT(*) AS item_cnt,\n  SUM(avail_qty) AS total_qty\nFROM `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items`\n\
      GROUP BY stock_status\nORDER BY stock_status"
    expect:
      exact_rows: 4
      must_contain:
      - stock_status: AVAILABLE
        item_cnt: 28
        total_qty: 715
      - stock_status: OUT_OF_STOCK
        item_cnt: 2
        total_qty: 0
      - stock_status: RESERVED
        item_cnt: 1
        total_qty: 10
      - stock_status: RETURN_INSPECTION
        item_cnt: 1
        total_qty: 15
  gold_answer: 재고상태별 집계 결과 AVAILABLE(즉시 출고 가용) 28건·715개, RESERVED(결제 진행 예약) 1건·10개, RETURN_INSPECTION(반품 검수 대기) 1건·15개, OUT_OF_STOCK(일시품절) 2건·0개이다.
  grading:
    must_include:
    - '715'
    - '28'
    - OUT_OF_STOCK
    must_not_include: []
    cite:
    - doc: '07'
      locator: 제3조
- id: EQ20
  category: parity
  sibling_cq: CQ16
  question: 실시간 행동로그에서 장바구니 담기 이후 이탈하지 않고 동일 세션 내에 결제완료까지 정상 전환된 세션 ID와 회원 ID, 구매 상품 ID 및 해당 회원의 멤버십 등급은 무엇인가?
  expected_winner: tie
  rationale: ont_events에서 event_type='purchase'가 존재하는 세션을 찾고 users와 조인하는 기본 조회로 두 암 모두 동등하게 수행함.
  evidence:
  - doc: '07'
    pdf: 07_INTERNAL_K마켙_초개인화추천_및_CRM타겟팅_운영내규_2025.pdf
    page: 1
    locator: 제1조~제2조
    section: 제1조~제2조
    authority: internal
    role: rule
    quote: 제1조(목적) 이 내규는 주식회사 K마켙(이하 "당사"라 한다)이 운영하는 온라인 패션·라이프스타일 플랫폼에서 고객 행동로그와 상품·재고 원장을 결합하여 초개인화 상품 추천 및 타겟팅 할인쿠폰을 발급할 때 준수하여야 할 비즈니스 의사결정
      기준과 개인정보·공정거래 가드레일을 정함을 목적으로 한다. 제2조(장바구니 미결제 이탈 고객 실시간 탐지 및 동의 검증 의무) ① AI추천랩 및 CRM 시스템은 실시간 행동로그 원장(`events`)에서 이벤트 유형이 장바구니 담기(`event_type
      = 'cart'`)로 기록된 후 동일 세션(`session_id`) 내에 결제완료(`purchase`) 이벤트가 발생하지 아니한 미결제 이탈 고객을 실시간 탐지한다. ② 제1항에 따라 탐지된 고객에게 장바구니 리마인드 알림이나 개인화 타겟팅 쿠폰을
      발급하기 전에, 반드시 회원 원장(`users`)의 마케팅 및 맞춤형 추천 동의 여부(`marketing_opt_in`)를 조회하여야 한다. ③ `users.marketing_opt_in = True`인 회원에 한하여 개인화 추천 및 타겟팅 쿠폰을
      발급할 수 있으며, `users.marketing_opt_in = False`인 회원에 대하여는 어떠한 경우에도 개인 식별 기반 리마인드 푸시나 타겟팅 쿠폰을 발급하여서는 아니 된다(개인정보보호위원회 행태정보 가이드라인 제3조 준수).
  answer_queries:
  - sql: "SELECT\n  e.session_id,\n  e.user_id,\n  e.product_id,\n  u.membership_tier\nFROM `finance-ontology-changseop.kmarket_ecommerce.ont_events`\
      \ e\nJOIN `finance-ontology-changseop.kmarket_ecommerce.users` u ON e.user_id = u.user_id\nWHERE e.event_type = 'purchase'"
    expect:
      scalar:
        session_id: SES-1008-A
        user_id: USR-1008
        product_id: PRD-3004
        membership_tier: VIP
  gold_answer: 장바구니 담기 후 동일 세션 내 결제완료(purchase)까지 전환된 세션은 SES-1008-A이며, 회원 ID는 USR-1008(VIP 등급), 구매 상품 ID는 PRD-3004이다.
  grading:
    must_include:
    - SES-1008-A
    - USR-1008
    - PRD-3004
    - VIP
    must_not_include: []
    cite:
    - doc: '07'
      locator: 제1조~제2조
