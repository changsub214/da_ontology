    quote: 제3조(체화재고의 정의 및 클리어런스 마진 하한 완화 특례) ① 물류 원장(`inventory_items`)상 입고 후 경과일수(`stock_age_days`)가 90일 이상이고 가용재고(`available_stock`)가 30개 이상
      누적된 상품은 '체화재고(Slow-moving / Aged Inventory)'로 분류한다. ② 제2조제2항에도 불구하고, 제1항의 체화재고(`stock_age_days >= 90`)에 해당하는 상품에 대하여는 창고 보관료 절감 및 현금흐름 회수를
      위하여 최저마진 가드레일 하한선을 100분의 25(25.0%)에서 100분의 10(10.0%)으로 완화하며, 정상 판매가 대비 최대 30%까지 클리어런스 할인쿠폰 또는 번들 할인을 적용할 수 있다.
  answer_queries:
  - sql: "SELECT\n  p.product_id AS main_product_id,\n  inv.avail_qty AS main_avail_qty,\n  p.substitute_product_id,\n  inv_sub.age_days AS sub_age_days,\n\
      \  inv_sub.avail_qty AS sub_avail_qty,\n  CASE WHEN inv_sub.age_days >= 90 AND inv_sub.avail_qty >= 30 THEN 10.0 ELSE 25.0 END AS clearance_floor_margin_pct\n\
      FROM `finance-ontology-changseop.kmarket_ecommerce.ont_events` e\nJOIN `finance-ontology-changseop.kmarket_ecommerce.products` p ON e.product_id\
      \ = p.product_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items` inv ON p.product_id = inv.product_id\nJOIN `finance-ontology-changseop.kmarket_ecommerce.ont_inventory_items`\
      \ inv_sub ON p.substitute_product_id = inv_sub.product_id\nWHERE e.session_id = 'SES-1007-A' AND e.event_type = 'cart'"
    expect:
      scalar:
        main_product_id: PRD-3009
        main_avail_qty: 0
        substitute_product_id: PRD-3002
        sub_age_days: 125
        sub_avail_qty: 50
        clearance_floor_margin_pct: 10.0
  gold_answer: PRD-3009는 현재 가용재고가 0개인 일시품절(OUT_OF_STOCK) 상태이므로 추천이 차단되며, 대체 상품인 PRD-3002(아틀리에 메리노울 터틀넥 니트 아이보리, 입고 125일차·가용재고 50개)로 전환 추천해야 한다.
    PRD-3002는 입고 90일 이상 및 가용재고 30개 이상 체화재고 요건을 충족하여 MD 내규 제3조에 따라 최저마진율 하한이 10.0%(10%)로 완화된다.
  grading:
    must_include:
    - PRD-3002
    - 125일
    - 10(\.0)?%
    must_not_include: []
