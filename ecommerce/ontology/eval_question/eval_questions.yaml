    page: 3
    locator: 제11조제3항~제5항
    section: 제11조제3항~제5항
    authority: binding
    role: rule
    quote: ③ 제1항 및 제2항에 따른 판매촉진비용의 분담비율은 대규모유통업자와 납품업자등이 해당 판매촉진행사를 통하여 직접적으로 얻을 것으로 예상되는 경제적 이익의 비율에 따라 정하되, 대규모유통업자와 납품업자등 사이의 구체적인 분담비율을 산정할
      수 없는 경우에는 대규모유통업자와 납품업자등의 예상편익이 같은 것으로 추정한다. ④ 제3항에 따른 납품업자등의 판매촉진비용 분담비율은 어떠한 경우에도 100분의 50을 초과하여서는 아니 된다. 기본 거래계약서나 개별 특약에 100분의 50을 초과하는
      분담비율이 기재되어 있더라도 100분의 50을 초과하는 부분은 무효로 하며 대규모유통업자가 전액 부담하여야 한다. ⑤ 다만, 납품업자등이 자발적으로 대규모유통업자에게 요청하여 다른 납품업자등과 차별화되는 판매촉진행사를 실시하려는 경우에는 대규모유통업자는
